                              																																																																																															/* ============================================================
                              																																																																																															   RENDER: BOARD VIEW
                              																																																																																															============================================================ */
                              																																																																																															function renderBoard() {
                              																																																																																															  const container = document.getElementById('view-board');
                              																																																																																															  const board = getBoard(state.currentBoardId);
                              																																																																																															  if (!board) { container.innerHTML = '<p class="text-muted">Board not found.</p>'; return; }

                              																																																																																															  const fronter = getAlter(state.activeFronterId);
                              																																																																																															  const posts = state.posts
                              																																																																																															    .filter(p => p.boardId === board.id)
                              																																																																																															    .sort((a,b) => {
                              																																																																																															      if (a.pinned !== b.pinned) return b.pinned ? 1 : -1;
                              																																																																																															      return b.timestamp - a.timestamp;
                              																																																																																															    });

                              																																																																																															  const boardColor = board.color || '#7c6fcd';

                              																																																																																															  container.innerHTML = `
                              																																																																																															    <div style="background:${boardColor}18;border-radius:var(--radius-lg) var(--radius-lg) 0 0;border-bottom:3px solid ${boardColor};padding:18px 20px 14px;margin:-24px -24px 24px;">
                              																																																																																															      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
                              																																																																																															        <div style="width:12px;height:12px;border-radius:50%;background:${boardColor};flex-shrink:0;"></div>
                              																																																																																															        <h1 style="flex:1">${esc(board.name)}</h1>
                              																																																																																															        <button class="btn btn-ghost btn-sm" onclick="openBoardModal('${esc(board.id)}')">Edit ${cap(t('board'))}</button>
                              																																																																																		<button
                              																								  class="btn btn-ghost btn-sm"
                              																								  onclick="archiveBoard('${board.id}')"
                              																								>
                              																								  Archive
                              																								</button>													        <button class="btn btn-danger btn-sm" onclick="deleteBoard('${esc(board.id)}')">Delete</button>
                              																																																																																															      </div>
                              																																																																																															      ${board.description ? `<p class="text-sm text-muted mt-1">${esc(board.description)}</p>` : ''}
                              																																																																																															    </div>

                              																																																																																															    ${fronter ? `
                              																																																																																															      <div class="compose-box">
                              																																																																																															        <div class="compose-header">
                              																																																																																															          <div class="post-avatar" style="background:${esc(fronter.color)};width:28px;height:28px;font-size:0.85rem;">${esc(fronter.emoji||fronter.name[0])}</div>
                              																																																																																															          <span class="compose-as">Posting as <strong style="color:${esc(fronter.color)}">${esc(fronter.name)}</strong></span>
                              																																																																																															        </div>
                              																																																																																															        <textarea id="compose-input" placeholder="Write a ${t('post')}..." rows="3"></textarea>
                              																																																																																															        <div class="compose-footer">
                              																																																																																															          <button class="btn btn-primary btn-sm" onclick="submitPost()">Post</button>
                              																																																																																															        </div>
                              																																																																																															      </div>
                              																																																																																															    ` : `
                              																																																																																															      <div class="card card-sm mb-2" style="text-align:center;color:var(--text-2);font-size:0.85rem;">
                              																																																																																															        Select who is ${t('fronting')} to post a message.
                              																																																																																															      </div>
                              																																																																																															    `}

                              																																																																																															    ${!posts.length ? `
                              																																																																																															      <div class="empty-state">
                              																																																																																															        <div class="empty-icon">◈</div>
                              																																																																																															        <div class="empty-title">No ${t('posts')} yet</div>
                              																																																																																															        <div class="empty-desc">${fronter ? 'Be the first to post something.' : `Set who is ${t('fronting')} and start posting.`}</div>
                              																																																																																															      </div>
                              																																																																																															    ` : `
                              																																																																																															      <div class="post-list">
                              																																																																																															        ${posts.map(p => renderPost(p)).join('')}
                              																																																																																															      </div>
                              																																																																																															    `}
                              																																																																																															  `;
                              																																																																																															}

                              																																																																																															function renderPost(p) {
                              																																																																																															  const alter = getAlter(p.alterId);
                              																																																																																															  const name = alter ? alter.name : 'Unknown';
                              																																																																																															  const color = alter ? (alter.color || '#7c6fcd') : '#7c6fcd';
                              																																																																																															  const emoji = alter ? (alter.emoji || alter.name[0]) : '?';
                              																																																																																															  const pronouns = alter ? alter.pronouns : '';
                              																																																																																															  const compact = state.settings.compactPosts;
                              																																																																																															  																  return `
                              																																																																																															    <div class="post ${p.pinned ? 'pinned' : ''}" style="${p.pinned ? `border-color:${color};` : ''}">
                              																																																																																															      <div class="post-header">
                              																																																																																															        <div class="post-avatar" style="background:${esc(color)}">${esc(emoji)}</div>
                              																																																																																															        <div class="post-meta">
                              																																																																																															          <div class="post-author" style="color:${esc(color)}">${esc(name)}${p.pinned ? ' <span class="post-pin-icon">📌</span>' : ''}</div>
                              																																																																																															          ${!compact && pronouns && state.settings.showPronouns ? `<div class="post-pronouns">${esc(pronouns)}</div>` : ''}
                              																																																																																															        </div>
                              																																																																																															        <span class="post-time">${fmt(p.timestamp)}</span>
                              																																																																																															      </div>
                              																																																																																															      <div class="post-content">${esc(p.content)}</div>
                              																																																																																															<div class="post-actions">
                              																														  <button class="btn btn-ghost btn-sm"
                              																														    onclick="togglePin('${esc(p.id)}')">
                              																														    ${p.pinned ? 'Unpin' : 'Pin'}
                              																														  </button>

                              																														  <!-- <button onclick="toggleReaction('${p.id}','❤️')">
                              																														    ❤️
                              																														  </button> -->
                              																														  <div class="post-reactions">
                              																											  ${renderReactions(p)}

                              																											  <button
                              																											    class="reaction-chip reaction-add btn btn-primary btn-sm"
                              																											    onclick="showReactionPicker('${p.id}')"
                              																											  >
                              																											    +
                              																											  </button>
                              																											</div>

                              																														  <button class="btn btn-ghost btn-sm"
                              																														    style="color:#ef4444"
                              																														    onclick="deletePost('${esc(p.id)}')">
                              																														    Delete
                              																														  </button>
                              																														</div>
                              																																																																																															    </div>
                              																																																																																															  `;
                              																																																																																															}

                              																																																						function showReactionPicker(postId) {
                              																											  const emojis = [
                              																											    '❤️',
                              																											    '😂',
                              																											    '⭐',
                              																											    '🫂',
                              																											    '😭',
                              																											    '🔥',
                              																											    '👍',
                              																											    '👎'
                              																											  ];

                              																											  const choice = prompt(
                              																											    emojis.join(' ')
                              																											  );

                              																											  if (choice)
                              																											    toggleReaction(postId, choice);
                              																											}function renderReactions(post) {
                              																											  if (!post.reactions)
                              																											    post.reactions = {};

                              																											  return Object.entries(post.reactions)
                              																											    .map(([emoji, users]) => `
                              																											      <button
                              																											        class="reaction-chip"
                              																											        onclick="toggleReaction('${post.id}','${emoji}')"
                              																											      >
                              																											        ${emoji} ${users.length}
                              																											      </button>
                              																											    `)
                              																											    .join('');
                              																											}
                              																																																																																															function toggleReaction(postId, emoji) {
                              																											  const post =
                              																											    state.posts.find(p => p.id === postId);

                              																											  if (!post)
                              																											    return;

                              																											  if (!post.reactions)
                              																											    post.reactions = {};

                              																											  if (!post.reactions[emoji])
                              																											    post.reactions[emoji] = [];

                              																											  const users =
                              																											    post.reactions[emoji];

                              																											  const idx =
                              																											    users.indexOf(state.activeFronterId);

                              																											  if (idx >= 0)
                              																											    users.splice(idx, 1);
                              																											  else
                              																											    users.push(state.activeFronterId);

                              																											  if (users.length === 0)
                              																											    delete post.reactions[emoji];

                              																											  saveState();
                              																											  renderBoard();
                              																											}

                              																																																																									function submitPost() {
                              																																																						  const input = document.getElementById('compose-input');
                              																																																						  const content = input ? input.value.trim() : '';

                              																																																						  if (
                              																																																						    !content ||
                              																																																						    !state.activeFronterId ||
                              																																																						    !state.currentBoardId
                              																																																						  ) {
                              																																																						    return;
                              																																																						  }

                              																																																						  const post = {
                              																																																						    id: uid(),
                              																																																						    boardId: state.currentBoardId,
                              																																																						    alterId: state.activeFronterId,
                              																																																						    content,
                              																																																						    timestamp: Date.now(),
                              																																																						    reactions: {},
                              																																																						    pinned: false
                              																																																						  };

                              																																																						  state.posts.unshift(post);

                              																																																						  saveState();

                              																																																						  input.value = '';

                              																																																						  renderBoard();
                              																																																						  renderSidebar();
                              																																																						}

                              																																																																																															function togglePin(id) {
                              																																																																																															  const p = state.posts.find(p => p.id === id);
                              																																																																																															  if (p) { p.pinned = !p.pinned; saveState(); renderBoard(); }
                              																																																																																															}

                              																																																																																															function deletePost(id) {
                              																																																																																															  if (!confirm('Delete this post?')) return;
                              																																																																																															  state.posts = state.posts.filter(p => p.id !== id);
                              																																																																																															  saveState(); renderBoard();
                              																																																																																															}

                              																																																																																															/* ============================================================
                              																																																																																															   RENDER: SETTINGS VIEW
                              																																																																																															============================================================ */
                              																																																																																															function renderSettings() {

                              																																																																																															  ).join('');

                              																																																																																															  const termFields = [

                              																																																																																															    ['alters','Plural term for system members'],

                              																																																																																															    ['pronouns','Label for pronoun field']
                              																																																																																															  ];

                              																																																																																															  document.getElementById('view-settings').innerHTML = `
                              																																																																																															    <div class="page-header">
                              																																																																																															      <div class="page-title-dot"></div>
                              																																																																																															      <h1>Settings</h1>
                              																																																																																															    </div>

                              																																																																																															    <div class="tab-bar" id="settings-tabs">

                              																																																																																															    <!-- GENERAL -->

                              																																																																																															          </div>
                              																																																																																															        </div>

                              																																																																																															function showSettingsTab(tab, btn) {
                              																																																																																															  ['general','appearance','accessibility','terminology','data'].forEach(t => {
                              																																																																																															    const el = document.getElementById('stab-'+t);

                              																																																																																															  });
                              																																																																																															  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

                              																																																																																															}

                              																																																																																															function changeSetting(key, val) {
                              																																																																																															  state.settings[key] = val;
                              																																																																																															  saveState();
                              																																																																																															  applyTheme();
                              																																																																																															}

                              																																																																																															function setDefaultAccent(color) {
                              																																																																																															  // Only applies if no fronter
                              																																																																																															  if (!state.activeFronterId) {
                              																																																																																															    document.documentElement.style.setProperty('--accent', color);
                              																																																																																															    document.documentElement.style.setProperty('--accent-text', accentText(color));
                              																																																																																															    document.documentElement.style.setProperty('--accent-dim', color+'28');
                              																																																																																															  }
                              																																																																																															  document.querySelectorAll('#default-presets .color-preset').forEach(el => {
                              																																																																																															    el.classList.toggle('selected', el.style.background === color || el.getAttribute('style').includes(color));
                              																																																																																															  });
                              																																																																																															}

                              																																																																																															function resetTerminology() {
                              																																																																																															  if (!confirm('Reset all terminology to defaults?')) return;
                              																																																																																															  state.terminology = { ...DEFAULT_TERMINOLOGY };
                              																																																																																															  saveState(); renderAll();
                              																																																																																															}

                              																																																																																															   ALTER MODAL
                              																																																																																															============================================================ */
                              																																				function createField() {
                                if (!state.systemFields) {
                                  state.systemFields = [];
                                }

                                state.systemFields.push({
                                  id: crypto.randomUUID(),
                                  name: '',
                                  value: ''
                                });

                                saveState();
                                renderSystem();
                              }
                              function deleteField(fieldId) {
                                state.systemFields =
                                  state.systemFields.filter(
                                    field => field.id !== fieldId
                                  );

                                saveState();
                                renderSystem();
                              }
                              function updateFieldName(fieldId, value) {
                                const field =
                                  state.systemFields.find(
                                    f => f.id === fieldId
                                  );

                                if (!field) return;

                                field.name = value;

                                saveState();
                              }

                              function updateFieldValue(fieldId, value) {
                                const field =
                                  state.systemFields.find(
                                    f => f.id === fieldId
                                  );

                                if (!field) return;

                                field.value = value;

                                saveState();
                              }
                              function openAlterModal(id) {

                              																																																																																															  const a = alter || { id: uid(), name: '', pronouns: '', role: '', color: PRESET_COLORS[Math.floor(Math.random()*PRESET_COLORS.length)], emoji: '', notes: '' };

                              																																																																																															  showModal(`
                              																																																																																															    <div class="modal-header">
                              																																																																																															      <h2>${isEdit ? 'Edit' : 'New'} ${cap(t('alter'))}</h2>

                              																																																																																															        </div>
                              																																																																																															      </div>
                              																																																																																															      <div class="form-row">

                              																																																																																															        </div>
                              																																																																																															        <div class="form-group">

                              																																																																																															        </div>
                              																																																																																															      </div>

                              																																																																																															            ${PRESET_COLORS.map(c=>`<div class="color-preset ${c===a.color?'selected':''}" style="background:${c}" onclick="document.getElementById('a-color').value='${c}';syncColorPresets('${c}')"></div>`).join('')}

                              																																																																																															function syncColorPresets(color) {
                              																																																																																															  document.querySelectorAll('#alter-presets .color-preset').forEach(el => {
                              																																																																																															    const c = el.style.background;
                              																																																																																															    el.classList.toggle('selected', c === color || el.style.backgroundColor === color);
                              																																																																																															  });
                              																																																																																															}

                              																																																																																															function saveAlter(id, isEdit) {
                              																																																																																															  const name = document.getElementById('a-name').value.trim();
                              																																																																																															  if (!name) { alert('Name is required.'); return; }
                              																																																																																															  const alter = {
                              																																																																																															    id,
                              																																																																																															    name,
                              																																																																																															    pronouns: document.getElementById('a-pronouns').value.trim(),
                              																																																																																															    role: document.getElementById('a-role').value.trim(),
                              																																																																																															    color: document.getElementById('a-color').value,
                              																																																																																															    emoji: document.getElementById('a-emoji').value.trim(),
                              																																																																																															    notes: document.getElementById('a-notes').value.trim(),
                              																																																																																															    createdAt: isEdit ? (getAlter(id)||{}).createdAt || Date.now() : Date.now()
                              																																																																																															  };
                              																																																																																															  if (isEdit) {
                              																																																																																															    const idx = state.alters.findIndex(a => a.id === id);
                              																																																																																															    if (idx >= 0) state.alters[idx] = alter; else state.alters.push(alter);
                              																																																																																															  } else {
                              																																																																																															    state.alters.push(alter);
                              																																																																																															  }
                              																																																																																															  saveState(); closeModal(); renderAll();
                              																																																																																															  if (state.activeFronterId === id) applyTheme();
                              																																																																																															}

                              																																																																																															function deleteAlter(id) {
                              																																																																																															  if (!confirm(`Delete this ${t('alter')}? Their ${t('posts')} will remain.`)) return;
                              																																																																																															  state.alters = state.alters.filter(a => a.id !== id);
                              																																																																																															  if (state.activeFronterId === id) state.activeFronterId = null;
                              																																																																																															  saveState(); closeModal(); renderAll();
                              																																																																																															}

                              																																																																																															      <div class="form-group">
                              																																																																																															        <label class="form-label">${cap(t('board'))} Name *</label>
                              																																																																																															        <input class="form-input" id="b-name" value="${esc(b.name)}" placeholder="e.g. General, Journal, Daily…" />
                              																																																																																															      </div>
                              																																																																																															      <div class="form-group">
                              																																																																																															        <label class="form-label">Description</label>
                              																																																																																															        <input class="form-input" id="b-desc" value="${esc(b.description)}" placeholder="What is this ${t('board')} for?" />
                              																																																																																															      </div>


                              																																																																																															      <div class="form-group">
                              																																																																																															        <label class="form-label">Colour</label>
                              																																																																																															        <div class="form-color-row">
                              																																																																																															          <input type="color" class="form-color" id="b-color" value="${esc(b.color)}" oninput="syncBoardPresets(this.value)" />
                              																																																																																															          <div class="color-presets" id="board-presets">
                              																																																																																															            ${PRESET_COLORS.map(c=>`<div class="color-preset ${c===b.color?'selected':''}" style="background:${c}" onclick="document.getElementById('b-color').value='${c}';syncBoardPresets('${c}')"></div>`).join('')}
                              																																																																																															          </div>
                              																																																																																															        </div>
                              																																																																																															      </div>
                              																																																																																															    </div>
                              																																																																																															    <div class="modal-footer">
                              																																																																																															      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                              																																																																																															      <button class="btn btn-primary" onclick="saveBoard('${esc(b.id)}',${isEdit})">Save</button>
                              																																																																																															    </div>
                              																																																																																															  `);
                              																																																																																															}

                              																																																																																															function syncBoardPresets(color) {
                              																																																																																															  document.querySelectorAll('#board-presets .color-preset').forEach(el => {
                              																																																																																															    el.classList.toggle('selected', el.style.backgroundColor === color || el.style.background === color);
                              																																																																																															  });
                              																																																																																															}

                              																																																																																															function saveBoard(id, isEdit) {
                              																																																			  const name = document.getElementById('b-name').value.trim();

                              																																																			  if (!name) {
                              																																																			    alert('Name is required.');
                              																																																			    return;
                              																																																			  }

                              																																																			  const board = {
                              																																																			    id,
                              																																																			    name,
                              																																																			    description: document.getElementById('b-desc').value.trim(),
                              																																																			    color: document.getElementById('b-color').value,
                              																																																			    createdAt: isEdit
                              																																																			      ? (getBoard(id)?.createdAt || Date.now())
                              																																																			      : Date.now()
                              																																																			  };

                              																																																			  if (isEdit) {
                              																																																			    const idx = state.boards.findIndex(b => b.id === id);

                              																																																			    if (idx >= 0) {
                              																																																			      state.boards[idx] = board;
                              																																																			    } else {
                              																																																			      state.boards.push(board);
                              																																																			    }
                              																																																			  } else {
                              																																																			    state.boards.push(board);
                              																																																			  }

                              																																																			  saveState();
                              																																																			  closeModal();
                              																																																			  renderAll();

                              																																																			  if (!isEdit) {
                              																																																			    navigate('board', id);
                              																																																			  }
                              																																																			}

                              																																																																																															function deleteBoard(id) {
                              																																																																																															  if (!confirm(`Delete this ${t('board')} and all its ${t('posts')}?`)) return;
                              																																																																																															  state.boards = state.boards.filter(b => b.id !== id);
                              																																																																																															  boards = state.boards.filter(b => !b.archived);
                              																																																																																															  state.posts = state.posts.filter(p => p.boardId !== id);
                              																																																																																															  if (state.currentBoardId === id) state.currentBoardId = null;
                              																																																																																															  saveState();
                              																																																																																															  renderSidebar();
                              																																																																																															  navigate('alters');
                              																																																																																															}



                              																																																																																															/* ============================================================
                              																																																																																															   MODAL SYSTEM
                              																																																																																															============================================================ */
                              																																																																																															function showModal(html) {
                              																																																																																															  const container = document.getElementById('modal-container');
                              																																																																																															  container.innerHTML = `<div class="modal-backdrop" onclick="handleBackdropClick(event)"><div class="modal">${html}</div></div>`;
                              																																																																																															}

                              																																																																																															function closeModal() {
                              																																																																																															  document.getElementById('modal-container').innerHTML = '';
                              																																																																																															}

                              																																																																																															function handleBackdropClick(e) {
                              																																																																																															  if (e.target.classList.contains('modal-backdrop')) closeModal();
                              																																																																																															}

                              																																																																																															/* ============================================================
                              																																																																																															   DATA EXPORT / IMPORT
                              																																																																																															============================================================ */
                              																																																																																															function exportData() {
                              																																																																																															  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
                              																																																																																															  const url = URL.createObjectURL(blob);
                              																																																																																															  const a = document.createElement('a');
                              																																																																																															  a.href = url;
                              																																																																																															  a.download = `paracosm-${new Date().toISOString().slice(0,10)}.json`;
                              																																																																																															  a.click();
                              																																																																																															  URL.revokeObjectURL(url);
                              																																																																																															}

                              																																																																																															function importData(event) {
                              																																																																																															  const file = event.target.files[0];
                              																																																																																															  if (!file) return;
                              																																																																																															  const reader = new FileReader();
                              																																																																																															  reader.onload = function(e) {
                              																																																																																															    try {
                              																																																																																															      const data = JSON.parse(e.target.result);
                              																																																																																															      if (!data.alters || !data.boards) throw new Error('Invalid file');
                              																																																																																															      if (!confirm('This will replace ALL current data. Continue?')) return;
                              																																																																																															      state = {
                              																																																																																															        ...state,
                              																																																																																															        ...data,
                              																																																																																															        terminology: { ...DEFAULT_TERMINOLOGY, ...(data.terminology || {}) },
                              																																																																																															        settings: { ...state.settings, ...(data.settings || {}) }
                              																																																																																															      };
                              																																																																																															      saveState(); applyTheme(); renderAll();
                              																																																																																															      alert('Data imported successfully!');
                              																																																																																															    } catch(err) {
                              																																																																																															      alert('Failed to import: invalid JSON file.');
                              																																																																																															    }
                              																																																																																															  };
                              																																																																																															  reader.readAsText(file);
                              																																																																																															  event.target.value = '';
                              																																																																																															}

                              																																																																																															function clearAllData() {
                              																																																																																															  if (!confirm('Delete everything? This cannot be undone.')) return;
                              																																																																																															  if (!confirm('Are you absolutely sure?')) return;
                              																																																																																															  localStorage.removeItem(STORAGE_KEY);
                              																																																																																															  location.reload();
                              																																																																																															}

                              																																																								function renderArchive() {
                              																		  const container = document.getElementById('view-archive');

                              																		  const archivedBoards = state.boards.filter(b => b.archived);

                              																		  container.innerHTML = `
                              																		    <div class="page-header">
                              																		      <h1>Archived Boards</h1>
                              																		    </div>

                              																		    ${archivedBoards.map(board => `
                              																		      <div class="card">
                              																		        <h3>${esc(board.name)}</h3>

                              																		        <button
                              																		          class="btn btn-secondary"
                              																		          onclick="unarchiveBoard('${board.id}')"
                              																		        >
                              																		          Restore
                              																		        </button>
                              																		      </div>
                              																		    `).join('')}
                              																		  `;
                              																		}																													/* ============================================================
                              																																																																																															   RENDER ALL
                              																																																																																															============================================================ */
                              																																																																																															function renderAll() {
                              																																																																																															  renderFronterSelect();
                              																																																																																															  renderSidebar();
                              																																																																																															  applyTheme();
                              																																																																																															  if (currentView === 'alters') renderAlters();
                              																																																																																															  else if (currentView === 'board') renderBoard();
                              																																																																																															  else if (currentView === 'settings') renderSettings();
                              																																																																																															  else if (currentView === 'system') renderSystem();
                              																																																																																															  else if (currentView === 'archive') renderArchive();
                              																																																																																															}

                              																																																																																															/* ============================================================
                              																																																																																															   KEYBOARD SHORTCUTS
                              																																																																																															============================================================ */
                              																																																																																															document.addEventListener('keydown', function(e) {
                              																																																																																															  // Escape closes modal
                              																																																																																															  if (e.key === 'Escape') closeModal();
                              																																																																																															  // Ctrl+Enter submits post
                              																																																																																															  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                              																																																																																															    const input = document.getElementById('compose-input');
                              																																																																																															    if (input && document.activeElement === input) submitPost();
                              																																																																																															  }
                              																																																																																															});

                              																																																																																															/* ============================================================
                              																																																																																															   SEED DATA (first run)
                              																																																																																															============================================================ */
                              																																																																																															function seedData() {
                              																																																																																															  if (state.alters.length > 0 || state.boards.length > 0) return;

                              																																																																																															  const hostId = uid(), alterId = uid(), boardId = uid();
                              																																																																																															  state.systemName = 'My System';
                              																																																																																															  state.alters = [
                              																																																																																															    { id: hostId, name: 'Host', pronouns: 'they/them', role: 'host', color: '#7c6fcd', emoji: '✦', notes: 'Primary fronter and system manager.', createdAt: Date.now() },
                              																																																																																															    { id: alterId, name: 'River', pronouns: 'she/her', role: 'protector', color: '#5db8e8', emoji: '🌊', notes: '', createdAt: Date.now() }
                              																																																																																															  ];
                              																																																																																															  state.boards = [
                              																																																																																															    { id: boardId, name: 'General', description: 'A space for everyday notes and messages.', color: '#7c6fcd', createdAt: Date.now(), categoryId: "journaling123"}
                              																																																																																															  ];
                              																																																																																															  state.posts = [
                              																																																																																															    { id: uid(), boardId, alterId: hostId, content: 'Welcome to Paracosm! 👋\n\nThis is your system message board. Create alters, set who is fronting, and start posting.', timestamp: Date.now() - 3600000, pinned: true },
                              																																																																																															    { id: uid(), boardId, alterId: alterId, content: 'Hi! You can customise my colour, pronouns, and role by clicking Edit on my card.', timestamp: Date.now() - 1800000, pinned: false }
                              																																																																																															  ];
                              																																																																																															  state.activeFronterId = hostId;
                              																																																								state.systemFields = [

                                {

                                  id: "abc123",

                                  name: "Favorite Color",

                                  value: "Blue"

                                }

                              ];																																							  saveState();
                              																																																																																															}

                              																																																																																															/* ============================================================
                              																																																																																															   INIT
                              																																																																																															============================================================ */
                              																																																																																															(function init() {
                              																																																  console.log('1 loadState');
                              																																																  loadState();

                              																																																  console.log('2 state', state);

                              																																																  console.log('3 seedData');
                              																																																  seedData();

                              																																																  console.log('4 applyTheme');
                              																																																  applyTheme();

                              																																																  state.boards.forEach(board => {
                              																								  if (board.archived === undefined) board.archived = false;
                              																								  if (board.order === undefined) board.order = 0;
                              																								});

                              																																																  console.log('5 renderAll');
                              																																																  renderAll();

                              																																																  console.log('6 navigate');
                              																																																  navigate('alters');

                              																																																  console.log('7 done');
                              																																																})();
    </script>
  </body>
</html>

   const raw          = _psImportData;
   const members      = raw.members || [];
   const customFields = (raw.custom_fields || []).filter(f => f.name);
   const conflict     = document.getElementById('ps-conflict').value;

   const want = {
   displayname:  !!document.getElementById('ps-field-displayname')  ?.checked,
   desc:         !!document.getElementById('ps-field-desc')          ?.checked,
   pronouns:     !!document.getElementById('ps-field-pronouns')      ?.checked,
   color:        !!document.getElementById('ps-field-color')         ?.checked,
   role:         !!document.getElementById('ps-field-role')          ?.checked,
   proxy:        !!document.getElementById('ps-field-proxy')         ?.checked,
   avatar:       !!document.getElementById('ps-field-avatar')        ?.checked,
   customfields: !!document.getElementById('ps-field-customfields')  ?.checked,
   customvalues: !!document.getElementById('ps-field-customvalues')  ?.checked,
   sysname:      !!document.getElementById('ps-field-sysname')       ?.checked,
   };

   // Optionally set system name
   if (want.sysname && raw.system && raw.system.name) {
   state.systemName = raw.system.name;
   }

   // Build a map from Pluralspace custom field id → Paracosm field id
   const psFieldIdToParacosmId = {};
   if (want.customfields && customFields.length) {
   if (!Array.isArray(state.systemFields)) state.systemFields = [];
   customFields.forEach(psField => {
    // Match by name to avoid duplicating on re-import
    let existing = state.systemFields.find(sf => sf.name.toLowerCase() === psField.name.toLowerCase());
    if (!existing) {
    existing = {
     id:      uid(),
     name:    psField.name,
     type:    psField.field_type === 'date' ? 'date' : 'text',
     options: []
    };
    state.systemFields.push(existing);
    }
    psFieldIdToParacosmId[psField.id] = existing.id;
   });
   }

   const normalizeColor = c => {
   if (!c) return null;
   const hex = c.startsWith('#') ? c : '#' + c;
   return /^#[0-9a-fA-F]{6}$/.test(hex) ? hex : null;
   };

   let created = 0, updated = 0, skipped = 0;

   members.forEach(m => {
   const rawName = (m.name || '').trim();
   if (!rawName) return;

   const existing = state.alters.find(a => a.name.toLowerCase() === rawName.toLowerCase());

   if (existing) {
    if (conflict === 'skip') { skipped++; return; }
    if (want.displayname && m.display_name !== undefined) existing.displayName = m.display_name || '';
    if (want.desc        && m.description)                existing.notes       = m.description;
    if (want.pronouns    && m.pronouns)                   existing.pronouns    = m.pronouns;
    if (want.role        && m.role)                       existing.role        = m.role;
    const col = normalizeColor(m.color);
    if (want.color && col) existing.color = col;
    if (want.avatar && (m.avatar_path || m.avatar_media_path)) {
    existing.avatarUrl = m.avatar_path || m.avatar_media_path;
    }
    if (want.proxy && (m.message_prefix || m.message_suffix)) {
    existing.proxyTags = [{ prefix: m.message_prefix || '', suffix: m.message_suffix || '' }];
    }
    if (want.customfields && want.customvalues && Array.isArray(m.custom_field_values)) {
    if (!existing.fieldValues) existing.fieldValues = {};
    m.custom_field_values.forEach(cfv => {
     const paraId = psFieldIdToParacosmId[cfv.custom_field_id];
     if (paraId && cfv.value !== undefined && cfv.value !== null) {
     existing.fieldValues[paraId] = String(cfv.value);
     }
    });
    }
    updated++;
   } else {
    const col = normalizeColor(m.color);
    const proxyTags = (want.proxy && (m.message_prefix || m.message_suffix))
    ? [{ prefix: m.message_prefix || '', suffix: m.message_suffix || '' }]
    : [];

    const fieldValues = {};
    if (want.customfields && want.customvalues && Array.isArray(m.custom_field_values)) {
    m.custom_field_values.forEach(cfv => {
     const paraId = psFieldIdToParacosmId[cfv.custom_field_id];
     if (paraId && cfv.value !== undefined && cfv.value !== null) {
     fieldValues[paraId] = String(cfv.value);
     }
    });
    }

    state.alters.push({
    id:          uid(),
    name:        rawName,
    displayName: (want.displayname && m.display_name) ? m.display_name : '',
    pronouns:    (want.pronouns    && m.pronouns)     ? m.pronouns     : '',
    role:        (want.role        && m.role)          ? m.role         : '',
    color:       (want.color       && col)             ? col            : PRESET_COLORS[Math.floor(Math.random() * PRESET_COLORS.length)],
    emoji:       '',
    avatarUrl:   (want.avatar && (m.avatar_path || m.avatar_media_path)) ? (m.avatar_path || m.avatar_media_path) : '',
    banner:      '',
    birthday:    '',
    proxyTags,
    keepProxy:   false,
    notes:       (want.desc && m.description) ? m.description : '',
    fieldValues,
    createdAt:   Date.now(),
    archived:    false,
    order:       state.alters.length,
    unreadBoardIds: [],
    lastSeenBoardTimes: [],
    });
    created++;
   }
   });

   saveState();
   renderAll();
   closeModal();
   _psImportData = null;

   const parts = [];
   if (created)  parts.push(`${created} created`);
   if (updated)  parts.push(`${updated} updated`);
   if (skipped)  parts.push(`${skipped} skipped`);
   showToast('Pluralspace import done — ' + parts.join(', ') + '.', 4500);
  }


  function importData(event) {
   const file = event.target.files[0];
   if (!file) return;
   const reader = new FileReader();
   reader.onload = function(e) {
   try {
   const data = JSON.parse(e.target.result);
   if (!data.alters || !data.boards) throw new Error('Invalid file');
   if (!confirm('This will replace ALL current data. Continue?')) return;
   state = {
   ...state,
   ...data,
   terminology: { ...DEFAULT_TERMINOLOGY, ...(data.terminology || {}) },
   settings: { ...state.settings, ...(data.settings || {}) }
   };
   (state.alters || []).forEach(a => {
   if (!a.fieldValues || typeof a.fieldValues !== 'object') a.fieldValues = {};
   if (typeof a.displayName !== 'string') a.displayName = '';
   if (typeof a.avatarUrl !== 'string') a.avatarUrl = '';
   if (typeof a.banner !== 'string') a.banner = '';
   if (typeof a.birthday !== 'string') a.birthday = '';
   if (!Array.isArray(a.proxyTags)) a.proxyTags = [];
   if (typeof a.keepProxy !== 'boolean') a.keepProxy = false;
   });
   saveState(); applyTheme(); renderAll();
   alert('Data imported successfully!');
   } catch(err) {
   alert('Failed to import: invalid JSON file.');
   }
   };
   reader.readAsText(file);
   event.target.value = '';
  }

  function clearAllData() {
   if (!confirm('Delete everything? This cannot be undone.')) return;
   if (!confirm('Are you absolutely sure?')) return;
   localStorage.removeItem(STORAGE_KEY);
   location.reload();
  }

  function renderArchive() {
   const container = document.getElementById('view-archive');

   const archivedBoards = state.boards.filter(b => b.archived);

   container.innerHTML = `
   <div class="page-header">
   <h1>Archived Boards</h1>
   </div>

   ${archivedBoards.map(board => `
   <div class="card">
   <h3>${esc(board.name)}</h3>

   <button
   class="btn btn-secondary"
   onclick="unarchiveBoard('${board.id}')"
   >
   Restore
   </button>
   </div>
   `).join('')}
   `;
  } /* ============================================================
   DASHBOARD / WIDGETS
   A customizable home page. Widgets live in state.dashboard.widgets,
   each with a grid position/size (12-col grid, 56px row height),
   a type, a color theme, and type-specific config. Drag = move,
   handle in bottom-right corner = resize. Everything persists via
   saveState() same as the rest of Paracosm.
  ============================================================ */

  const WIDGET_TYPES = {
   welcome:    { label: 'Welcome Banner',     icon: '👋', desc: 'A friendly greeting and system name.', defaultW: 12, defaultH: 2, minW: 4, minH: 2 },
   fronting:   { label: 'Currently Fronting', icon: '🌀', desc: 'Shows who\'s fronting right now.', defaultW: 4, defaultH: 3, minW: 3, minH: 2 },
   stats:      { label: 'System Stats',       icon: '📊', desc: 'Quick counts: alters, boards, posts.', defaultW: 4, defaultH: 3, minW: 3, minH: 2 },
   recentPosts:{ label: 'Recent Posts',       icon: '📝', desc: 'Latest activity across your boards.', defaultW: 5, defaultH: 5, minW: 3, minH: 3 },
   quickLinks: { label: 'Quick Links',        icon: '🔗', desc: 'One-tap shortcuts to your boards.', defaultW: 4, defaultH: 4, minW: 3, minH: 2 },
   frontHistory:{ label: 'Recent Switches',   icon: '🕓', desc: 'A short timeline of recent fronting changes.', defaultW: 5, defaultH: 4, minW: 3, minH: 3 },
   alterRoster:{ label: 'Alter Roster',       icon: '🧑‍🤝‍🧑', desc: 'A compact list of your system\'s alters.', defaultW: 4, defaultH: 5, minW: 3, minH: 3 },
   note:       { label: 'Sticky Note',        icon: '🗒️', desc: 'A free-text note you can edit anytime.', defaultW: 4, defaultH: 3, minW: 2, minH: 2 },
   clock:      { label: 'Clock',              icon: '🕰️', desc: 'Current time and date.', defaultW: 3, defaultH: 2, minW: 2, minH: 2 },
  };

  const WIDGET_COLOR_PRESETS = [
   null, '#7c6fcd', '#5db8e8', '#4caf82', '#e8a13d', '#e0607a', '#d65d5d', '#9c6bd6', '#2f3542'
  ];

  function defaultDashboard() {
   return {
   widgets: [
    { id: uid(), type: 'welcome',     x: 0, y: 0,  w: 12, h: 2, color: null, config: {} },
    { id: uid(), type: 'fronting',    x: 0, y: 2,  w: 4,  h: 3, color: null, config: {} },
    { id: uid(), type: 'stats',       x: 4, y: 2,  w: 4,  h: 3, color: null, config: {} },
    { id: uid(), type: 'quickLinks',  x: 8, y: 2,  w: 4,  h: 3, color: null, config: {} },
    { id: uid(), type: 'recentPosts', x: 0, y: 5,  w: 7,  h: 5, color: null, config: {} },
    { id: uid(), type: 'frontHistory',x: 7, y: 5,  w: 5,  h: 5, color: null, config: {} },
   ],
   nextZ: 1
   };
  }

  let dashDrag = null;   // { widgetId, startX, startY, origX, origY, pxPerCol, pxPerRow }
  let dashResize = null; // { widgetId, startX, startY, origW, origH, pxPerCol, pxPerRow }

  function getWidget(id) { return state.dashboard.widgets.find(w => w.id === id); }

  function widgetColorVars(w) {
   if (!w.color) return '';
   let rgb = '124,111,205';
   try { rgb = hexToRgb(w.color); } catch(e) {}
   return `--widget-bg:rgba(${rgb},0.13);--widget-border:${esc(w.color)};--widget-text:var(--text-0);`;
  }

  function renderDashboard() {
   const container = document.getElementById('view-dashboard');
   if (!container) return;
   if (!state.dashboard || !Array.isArray(state.dashboard.widgets)) state.dashboard = defaultDashboard();

   const widgets = state.dashboard.widgets;

   container.innerHTML = `
    <div class="page-header">
     <h1>Dashboard</h1>
     <button class="btn btn-secondary" onclick="openAddWidgetModal()">+ Add Widget</button>
    </div>
    ${widgets.length ? `<div id="dashboard-grid"></div>` : `
     <div id="dashboard-empty">
      <div style="font-size:2.4rem;margin-bottom:8px;">🗂️</div>
      <div style="font-weight:700;margin-bottom:4px;">Your dashboard is empty</div>
      <div class="text-sm" style="margin-bottom:16px;">Add a widget to see your system at a glance.</div>
      <button class="btn btn-primary" onclick="openAddWidgetModal()">+ Add Widget</button>
     </div>
    `}
   `;

   if (!widgets.length) return;

   const grid = document.getElementById('dashboard-grid');
   grid.innerHTML = widgets.map(w => renderWidgetShell(w)).join('');
   widgets.forEach(w => renderWidgetBody(w));
   attachDashboardDragHandlers();
  }

  function renderWidgetShell(w) {
   const meta = WIDGET_TYPES[w.type] || { label: 'Widget', icon: '❔' };
   return `
    <div class="widget" id="widget-${esc(w.id)}"
     style="grid-column:${w.x + 1} / span ${w.w};grid-row:${w.y + 1} / span ${w.h};${widgetColorVars(w)}"
     data-widget-id="${esc(w.id)}"
    >
     <div class="widget-head" data-drag-handle>
      <span class="widget-drag-handle" title="Drag to move">
       <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><circle cx="8" cy="6" r="1.6"/><circle cx="16" cy="6" r="1.6"/><circle cx="8" cy="12" r="1.6"/><circle cx="16" cy="12" r="1.6"/><circle cx="8" cy="18" r="1.6"/><circle cx="16" cy="18" r="1.6"/></svg>

      <span class="widget-actions">
       <button class="widget-action-btn" title="Customize" onclick="event.stopPropagation();openWidgetSettingsModal('${esc(w.id)}')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
       </button>
       <button class="widget-action-btn" title="Remove widget" onclick="event.stopPropagation();removeWidget('${esc(w.id)}')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
       </button>
      </span>
     </div>
     <div class="widget-body" id="widget-body-${esc(w.id)}"></div>
     <div class="widget-resize-handle" data-resize-handle title="Drag to resize">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><circle cx="20" cy="20" r="1.6"/><circle cx="20" cy="13" r="1.6"/><circle cx="13" cy="20" r="1.6"/></svg>
     </div>
    </div>
   `;
  }

  function widgetTitle(w) {
   if (w.config && w.config.title) return w.config.title;
   const meta = WIDGET_TYPES[w.type];
   return meta ? meta.label : 'Widget';
  }

  function renderWidgetBody(w) {
   const el = document.getElementById('widget-body-' + w.id);
   if (!el) return;
   switch (w.type) {
    case 'welcome': el.innerHTML = widgetWelcome(w); break;
    case 'fronting': el.innerHTML = widgetFronting(w); break;
    case 'stats': el.innerHTML = widgetStats(w); break;
    case 'recentPosts': el.innerHTML = widgetRecentPosts(w); break;
    case 'quickLinks': el.innerHTML = widgetQuickLinks(w); break;
    case 'frontHistory': el.innerHTML = widgetFrontHistory(w); break;
    case 'alterRoster': el.innerHTML = widgetAlterRoster(w); break;
    case 'note': el.innerHTML = widgetNote(w); break;
    case 'clock': el.innerHTML = widgetClock(w); break;
    default: el.innerHTML = `<div class="widget-empty-state">Unknown widget</div>`;
   }
  }

  function widgetWelcome(w) {
   const hour = new Date().getHours();
   const greeting = hour < 5 ? 'Still up' : hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
   const fronters = state.activeFronterIds.map(id => getAlter(id)).filter(Boolean);
   const fronterStr = fronters.length ? fronters.map(a => esc(a.name)).join(', ') : 'no one set';
   return `
    <div style="display:flex;align-items:center;justify-content:space-between;gap:14px;height:100%;flex-wrap:wrap;">
     <div>
      <div style="font-size:1.15rem;font-weight:800;">${greeting}, ${esc(state.systemName || 'system')} 👋</div>
      <div class="text-sm" style="opacity:0.75;margin-top:2px;">Currently fronting: ${fronterStr}</div>
     </div>
    </div>
   `;
  }

  function widgetFronting(w) {
   const fronters = state.activeFronterIds.map(id => getAlter(id)).filter(Boolean);
   if (!fronters.length) return `<div class="widget-empty-state">No one is currently set as fronting.</div>`;
   return fronters.map(a => {
    const hasUrl = a.avatarUrl && a.avatarUrl.trim();
    const isMain = a.id === state.activeFronterId;
    return `
     <div class="dash-fronter-row">
      <div class="dash-fronter-avatar" style="${hasUrl ? `background-image:url('${esc(a.avatarUrl)}')` : `background:${esc(a.color||'#7c6fcd')}`}">
       ${hasUrl ? '' : esc(a.emoji || (a.name||'?')[0] || '?')}
      </div>
      <div style="flex:1;min-width:0;">
       <div style="font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(a.name)} ${isMain ? '<span class="tag" style="margin-left:4px;">main</span>' : ''}</div>
       ${a.pronouns ? `<div class="text-sm" style="opacity:0.65;">${esc(a.pronouns)}</div>` : ''}
      </div>
     </div>
    `;
   }).join('');
  }

  function widgetStats(w) {
   const alterCount = state.alters.length;
   const boardCount = state.boards.filter(b => !b.archived).length;
   const postCount = state.posts.length;
   return `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:10px;height:100%;align-content:center;">
     <div><div class="dash-stat-big">${alterCount}</div><div class="dash-stat-label">${esc(cap(t('alters')))}</div></div>
     <div><div class="dash-stat-big">${boardCount}</div><div class="dash-stat-label">${esc(cap(t('boards')))}</div></div>
     <div><div class="dash-stat-big">${postCount}</div><div class="dash-stat-label">Posts</div></div>
    </div>
   `;
  }

  function widgetRecentPosts(w) {
   const posts = [...state.posts].sort((a,b) => b.timestamp - a.timestamp).slice(0, 8);
   if (!posts.length) return `<div class="widget-empty-state">No posts yet.</div>`;
   return posts.map(p => {
    const a = getAlter(p.alterId);
    const board = getBoard(p.boardId);
    const preview = (p.content || '').replace(/\n/g, ' ').slice(0, 90);
    return `
     <div style="padding:7px 0;border-bottom:1px solid var(--border);cursor:pointer;" onclick="navigate('board','${esc(p.boardId)}')">
      <div style="display:flex;gap:6px;align-items:baseline;">
       <span style="font-weight:700;font-size:0.82rem;">${esc(a ? a.name : 'Unknown')}</span>
       <span class="text-sm" style="opacity:0.55;">in ${esc(board ? board.name : '?')}</span>
      </div>
      <div class="text-sm" style="opacity:0.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(preview)}${(p.content||'').length>90?'…':''}</div>
     </div>
    `;
   }).join('');
  }

  function widgetQuickLinks(w) {
   const boards = state.boards.filter(b => !b.archived);
   if (!boards.length) return `<div class="widget-empty-state">No ${esc(t('boards'))} yet.</div>`;
   return `<div class="dash-quick-link-grid">
    ${boards.map(b => `
     <button class="dash-quick-link" onclick="navigate('board','${esc(b.id)}')">
      <span class="dash-quick-link-dot" style="background:${esc(b.color||'#7c6fcd')}"></span>
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;">${esc(b.name)}</span>
     </button>
    `).join('')}
   </div>`;
  }

  function widgetFrontHistory(w) {
   const entries = [...state.frontHistory].sort((a,b) => b.startTime - a.startTime).slice(0, 8);
   if (!entries.length) return `<div class="widget-empty-state">No switches logged yet.</div>`;
   return entries.map(e => {
    const names = (e.alterIds || []).map(id => getAlter(id)).filter(Boolean).map(a => esc(a.name)).join(', ') || 'Unknown';
    const start = new Date(e.startTime);
    const timeStr = start.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });

     <div style="padding:6px 0;border-bottom:1px solid var(--border);">
      <div style="font-weight:700;font-size:0.82rem;">${names}</div>
      <div class="text-sm" style="opacity:0.6;">${esc(timeStr)}${e.endTime ? '' : ' · ongoing'}</div>
     </div>
    `;
   }).join('');
  }

  function widgetAlterRoster(w) {
   const alters = state.alters.filter(a => !a.archived);
   if (!alters.length) return `<div class="widget-empty-state">No ${esc(t('alters'))} yet.</div>`;
   return alters.map(a => `
    <div class="dash-fronter-row" style="cursor:pointer;" onclick="navigate('alters')">
     <div class="dash-fronter-avatar" style="${a.avatarUrl ? `background-image:url('${esc(a.avatarUrl)}')` : `background:${esc(a.color||'#7c6fcd')}`}">
      ${a.avatarUrl ? '' : esc(a.emoji || (a.name||'?')[0] || '?')}
     </div>
     <div style="flex:1;min-width:0;">
      <div style="font-weight:600;font-size:0.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(a.name)}</div>
      ${a.role ? `<div class="text-sm" style="opacity:0.6;">${esc(a.role)}</div>` : ''}
     </div>
    </div>
   `).join('');

  function widgetNote(w) {
   const text = (w.config && w.config.text) || '';
   return `<textarea
    class="form-input" style="width:100%;height:100%;resize:none;border:none;background:transparent;padding:0;font-family:inherit;font-size:0.86rem;color:var(--widget-text,var(--text-0));"
    placeholder="Write a note..."
    oninput="updateWidgetNote('${esc(w.id)}', this.value)"
   >${esc(text)}</textarea>`;
  }

  function widgetClock(w) {
   const now = new Date();
   const time = now.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
   const date = now.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
   return `
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;">
     <div class="dash-stat-big" style="font-size:1.7rem;">${esc(time)}</div>
     <div class="dash-stat-label">${esc(date)}</div>
    </div>
   `;
  }

  function updateWidgetNote(id, text) {
   const w = getWidget(id);
   if (!w) return;
   w.config = w.config || {};
   w.config.text = text;
   saveState();
  }

  // Live-refresh the clock widget once a minute so it doesn't go stale
  // without forcing a full dashboard re-render (which would steal focus
  // from any note textarea currently being edited).
  setInterval(() => {
   if (currentView !== 'dashboard' || !state.dashboard) return;
   state.dashboard.widgets.filter(w => w.type === 'clock').forEach(w => renderWidgetBody(w));
  }, 30000);

  /* ---------- Add / remove / configure widgets ---------- */

  function openAddWidgetModal() {
   showModal(`
    <div class="modal-header">
     <h2>Add Widget</h2>
     <button class="btn btn-ghost btn-icon" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" style="display:flex;flex-direction:column;gap:10px;">
     ${Object.entries(WIDGET_TYPES).map(([type, meta]) => `
      <button class="add-widget-card" onclick="addWidget('${esc(type)}')">
       <span class="add-widget-icon">${meta.icon}</span>
       <span>
        <div class="add-widget-card-title">${esc(meta.label)}</div>
        <div class="add-widget-card-desc">${esc(meta.desc)}</div>
       </span>
      </button>
     `).join('')}
    </div>
    <div class="modal-footer">
     <button class="btn btn-secondary" onclick="closeModal()">Close</button>
    </div>
   `);
  }

  function findOpenSlot(w, h) {
   // Scans downward for the first row where a w×h block doesn't overlap
   // any existing widget, so new widgets land in open space instead of
   // stacking on top of everything at (0,0).
   const widgets = state.dashboard.widgets;
   const cols = 12;
   for (let y = 0; y < 200; y++) {
    for (let x = 0; x <= cols - w; x++) {
     const overlaps = widgets.some(o =>
      x < o.x + o.w && x + w > o.x && y < o.y + o.h && y + h > o.y
     );
     if (!overlaps) return { x, y };
    }
   }
   return { x: 0, y: 0 };
  }

  function addWidget(type) {
   const meta = WIDGET_TYPES[type];
   if (!meta) return;
   const { x, y } = findOpenSlot(meta.defaultW, meta.defaultH);
   state.dashboard.widgets.push({
    id: uid(), type, x, y, w: meta.defaultW, h: meta.defaultH, color: null, config: {}
   });
   saveState();
   closeModal();
   renderDashboard();
  }

  function removeWidget(id) {
   state.dashboard.widgets = state.dashboard.widgets.filter(w => w.id !== id);
   saveState();
   renderDashboard();
  }

  function openWidgetSettingsModal(id) {
   const w = getWidget(id);
   if (!w) return;
   const meta = WIDGET_TYPES[w.type] || {};
   showModal(`
    <div class="modal-header">
     <h2>${meta.icon || ''} ${esc(meta.label || 'Widget')}</h2>
     <button class="btn btn-ghost btn-icon" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" style="display:flex;flex-direction:column;gap:16px;">
     <div>
      <label class="form-label">Title</label>
      <input class="form-input" id="widget-title-input" value="${esc((w.config && w.config.title) || '')}" placeholder="${esc(meta.label || '')}" />
     </div>
     <div>
      <label class="form-label">Color</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;">
       ${WIDGET_COLOR_PRESETS.map(c => `
        <button class="widget-color-swatch ${w.color === c ? 'selected' : ''}"
         style="background:${c ? esc(c) : 'repeating-linear-gradient(45deg,var(--bg-2) 0 4px,var(--bg-3) 4px 8px)'};"
         title="${c ? esc(c) : 'Default'}"
         onclick="setWidgetColor('${esc(w.id)}','${c ? esc(c) : ''}')"
        ></button>
       `).join('')}
      </div>
     </div>
    </div>
    <div class="modal-footer">
     <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" onclick="saveWidgetSettings('${esc(w.id)}')">Save</button>
    </div>
   `);
  }

  function setWidgetColor(id, color) {
   const w = getWidget(id);
   if (!w) return;
   w.color = color || null;
   document.querySelectorAll('.widget-color-swatch').forEach(el => el.classList.remove('selected'));
   event.target.classList.add('selected');
  }

  function saveWidgetSettings(id) {
   const w = getWidget(id);
   if (!w) return;
   const titleInput = document.getElementById('widget-title-input');
   w.config = w.config || {};
   w.config.title = titleInput ? titleInput.value.trim() : '';
   saveState();
   closeModal();
   renderDashboard();
  }

  /* ---------- Drag to move, drag-handle to resize ---------- */

  function attachDashboardDragHandlers() {
   const grid = document.getElementById('dashboard-grid');
   if (!grid) return;

   grid.querySelectorAll('.widget').forEach(el => {
    const id = el.dataset.widgetId;
    const handle = el.querySelector('[data-drag-handle]');
    const resizeHandle = el.querySelector('[data-resize-handle]');

    handle.addEventListener('pointerdown', (e) => {
     if (e.target.closest('.widget-action-btn')) return;
     e.preventDefault();
     const w = getWidget(id);
     if (!w) return;
     const gridRect = grid.getBoundingClientRect();
     const colWidth = (gridRect.width - 11 * 14) / 12; // 14px gap, 12 cols
     dashDrag = {
      id, startClientX: e.clientX, startClientY: e.clientY,
      origX: w.x, origY: w.y, colWidth, rowHeight: 56 + 14
     };
     el.classList.add('dragging');
     document.body.style.userSelect = 'none';
     window.addEventListener('pointermove', onDashDragMove);
     window.addEventListener('pointerup', onDashDragEnd, { once: true });
    });

    if (resizeHandle) {
     resizeHandle.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const w = getWidget(id);
      if (!w) return;
      const gridRect = grid.getBoundingClientRect();
      const colWidth = (gridRect.width - 11 * 14) / 12;
      dashResize = {
       id, startClientX: e.clientX, startClientY: e.clientY,
       origW: w.w, origH: w.h, colWidth, rowHeight: 56 + 14
      };
      window.addEventListener('pointermove', onDashResizeMove);
      window.addEventListener('pointerup', onDashResizeEnd, { once: true });
     });
    }
   });
  }

  function onDashDragMove(e) {
   if (!dashDrag) return;
   const w = getWidget(dashDrag.id);
   if (!w) return;
   const dCols = Math.round((e.clientX - dashDrag.startClientX) / (dashDrag.colWidth + 14));
   const dRows = Math.round((e.clientY - dashDrag.startClientY) / dashDrag.rowHeight);
   const newX = Math.max(0, Math.min(12 - w.w, dashDrag.origX + dCols));
   const newY = Math.max(0, dashDrag.origY + dRows);
   if (newX !== w.x || newY !== w.y) {
    w.x = newX; w.y = newY;
    const el = document.getElementById('widget-' + w.id);
    if (el) {
     el.style.gridColumn = `${w.x + 1} / span ${w.w}`;
     el.style.gridRow = `${w.y + 1} / span ${w.h}`;
    }
   }
  }

  function onDashDragEnd() {
   if (!dashDrag) return;
   const el = document.getElementById('widget-' + dashDrag.id);
   if (el) el.classList.remove('dragging');
   document.body.style.userSelect = '';
   window.removeEventListener('pointermove', onDashDragMove);
   dashDrag = null;
   saveState();
  }

  function onDashResizeMove(e) {
   if (!dashResize) return;
   const w = getWidget(dashResize.id);
   if (!w) return;
   const meta = WIDGET_TYPES[w.type] || {};
   const dCols = Math.round((e.clientX - dashResize.startClientX) / (dashResize.colWidth + 14));
   const dRows = Math.round((e.clientY - dashResize.startClientY) / dashResize.rowHeight);
   const minW = meta.minW || 2, minH = meta.minH || 2;
   const newW = Math.max(minW, Math.min(12 - w.x, dashResize.origW + dCols));
   const newH = Math.max(minH, dashResize.origH + dRows);
   if (newW !== w.w || newH !== w.h) {
    w.w = newW; w.h = newH;
    const el = document.getElementById('widget-' + w.id);
    if (el) {
     el.style.gridColumn = `${w.x + 1} / span ${w.w}`;
     el.style.gridRow = `${w.y + 1} / span ${w.h}`;
    }
   }
  }

  function onDashResizeEnd() {
   if (!dashResize) return;
   window.removeEventListener('pointermove', onDashResizeMove);
   dashResize = null;
   saveState();
   renderDashboard(); // re-render so widget bodies reflow at new size
  }

  /* ============================================================
   RENDER ALL
  ============================================================ */
  function renderAll() {
   renderFronterSelect();
   renderSidebar();
   applyTheme();
   renderBackupBanner();
   updateChangelogBadge();
   if (currentView === 'dashboard') renderDashboard();
   else if (currentView === 'alters') renderAlters();
   else if (currentView === 'board') renderBoard();
   else if (currentView === 'settings') renderSettings();
   else if (currentView === 'system') renderSystem();
   else if (currentView === 'archive') renderArchive();
   else if (currentView === 'front') renderFront();
  }

  /* ============================================================
   KEYBOARD SHORTCUTS
  ============================================================ */
  document.addEventListener('keydown', function(e) {
   // Escape closes modal (or the image lightbox, if that's open)
   if (e.key === 'Escape') {
   const lb = document.getElementById('img-lightbox');
   if (lb) lb.remove(); else closeModal();
   }
   // Ctrl+Enter submits post
   if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
   const input = document.getElementById('compose-input');
   if (input && document.activeElement === input) submitPost();
   }
  });

 {

  /* ============================================================
   INIT
  ============================================================ */
  (function init() {
   console.log('1 loadState');
   loadState();

   console.log('2 state', state);

   console.log('3 seedData');
   seedData();

   console.log('4 applyTheme');
   applyTheme();

   state.boards.forEach(board => {
   if (board.archived === undefined) board.archived = false;
   if (board.categoryId === undefined) board.categoryId = null;
   if (board.order === undefined) board.order = 0;
  });
   if (!Array.isArray(state.categories)) state.categories = [];
   state.categories.forEach((c, i) => {
   if (c.order === undefined) c.order = i;
   if (c.collapsed === undefined) c.collapsed = false;
  });
   reindexCategories();
   reindexBoardList(boardsForCategory(null));
   state.categories.forEach(c => reindexBoardList(boardsForCategory(c.id)));
   if (!Array.isArray(state.frontHistory)) state.frontHistory = [];
   if (!Array.isArray(state.activeFronterIds)) {
   state.activeFronterIds = state.activeFronterId ? [state.activeFronterId] : [];
   }
   if (!state.dashboard || !Array.isArray(state.dashboard.widgets)) {
   state.dashboard = defaultDashboard();
   }
   if (state.settings.sidebarCollapsed) {
   document.body.classList.add('sidebar-rail');
   const btn = document.getElementById('sidebar-rail-toggle');
   if (btn) btn.title = 'Expand sidebar';
   const label = document.getElementById('sidebar-rail-toggle-label');
   if (label) label.textContent = 'Open sidebar';
   }
   if (!state._frontHistoryChecked) {
   state._frontHistoryChecked = true;
   if (state.activeFronterIds.length && !state.frontHistory.some(e => e.endTime == null)) {
   const now = Date.now();
   state.frontHistory.push({
    id: uid(),
    alterIds: [...state.activeFronterIds],
    mainId: state.activeFronterId || state.activeFronterIds[0],
    startTime: now,
    endTime: null,
    notes: '',
    createdAt: now
   });
   }
   saveState();
   }

   console.log('5 renderAll');
   renderAll();

   console.log('6 navigate');
   navigate('dashboard');

   console.log('7 done');
  })();

  // Filters the fronting checklist by name/display name as the person types —
  // mainly useful for larger systems where scrolling to find someone is slow.
  function filterFrontManageList(query) {
   const q = (query || '').toLowerCase().trim();
   const rows = document.querySelectorAll('#fm-alter-list .front-manage-row');
   let anyVisible = false;
   rows.forEach(row => {
   const name = row.getAttribute('data-fm-name') || '';
   const match = !q || name.includes(q);
   row.style.display = match ? '' : 'none';
   if (match) anyVisible = true;
   });
   const emptyMsg = document.getElementById('fm-no-results');
   if (emptyMsg) emptyMsg.style.display = (anyVisible || !rows.length) ? 'none' : '';
  }

  function onFrontManageCheckChange() {
   document.querySelectorAll('.fm-main-radio').forEach(r => {
   const cb = document.querySelector(`.fm-front-cb[value="${CSS.escape(r.value)}"]`);
   const stillIn = !!(cb && cb.checked);
   r.disabled = !stillIn;
   if (!stillIn && r.checked) r.checked = false;
   });
   const anyMain = Array.from(document.querySelectorAll('.fm-main-radio')).some(r => r.checked);
   if (!anyMain) {
   const firstChecked = document.querySelector('.fm-front-cb:checked');
   if (firstChecked) {
    const r = document.querySelector(`.fm-main-radio[value="${CSS.escape(firstChecked.value)}"]`);
    if (r) r.checked = true;
   }
   }
  }

  function applyFrontManage() {
   const newIds = Array.from(document.querySelectorAll('.fm-front-cb:checked')).map(cb => cb.value);
   const mainRadio = document.querySelector('.fm-main-radio:checked');
   const newMainId = mainRadio ? mainRadio.value : (newIds[0] || null);
   closeModal();
   updateFronting(newIds, newMainId);
  }

  /* ============================================================
   SIDEBAR BOARDS
  ============================================================ */
  function moveBoardUp(boardId) {
   const board = getBoard(boardId);
   if (!board) return;
   const list = boardsForCategory(board.categoryId);
   const idx = list.findIndex(b => b.id === boardId);
   if (idx <= 0) return;
   [list[idx - 1], list[idx]] = [list[idx], list[idx - 1]];
   reindexBoardList(list);
   saveState();
   renderSidebar();
  }
  function moveBoardDown(boardId) {
   const board = getBoard(boardId);
   if (!board) return;
   const list = boardsForCategory(board.categoryId);
   const idx = list.findIndex(b => b.id === boardId);
   if (idx === -1 || idx >= list.length - 1) return;
   [list[idx], list[idx + 1]] = [list[idx + 1], list[idx]];
   reindexBoardList(list);
   saveState();
   renderSidebar();
  }

  /* ============================================================
   DRAG & DROP — boards + categories
  ============================================================ */
  let draggedBoardId = null;
  let draggedCategoryId = null;

  function onBoardDragStart(e, boardId) {
   draggedBoardId = boardId;
   draggedCategoryId = null;
   e.dataTransfer.effectAllowed = 'move';
   e.dataTransfer.setData('text/plain', boardId); // Firefox needs data set to allow drag
   e.currentTarget.classList.add('dragging');
  }

  function onBoardDragOver(e) {
   if (!draggedBoardId) return;
   e.preventDefault();
   e.dataTransfer.dropEffect = 'move';
   const rect = e.currentTarget.getBoundingClientRect();
   const after = (e.clientY - rect.top) > rect.height / 2;
   e.currentTarget.classList.remove('drag-over-top', 'drag-over-bottom');
   e.currentTarget.classList.add(after ? 'drag-over-bottom' : 'drag-over-top');
  }

  function onBoardDragLeave(e) {
   e.currentTarget.classList.remove('drag-over-top', 'drag-over-bottom');
  }

  // Dropped onto a specific board row — insert before/after it depending on which
  // half of the row the cursor is over, within the target's category.
  function onBoardDrop(e, targetCategoryId, targetBoardId) {
   e.preventDefault();
   e.stopPropagation();
   const dropEl = e.currentTarget;
   const insertAfter = dropEl.classList.contains('drag-over-bottom');
   dropEl.classList.remove('drag-over-top', 'drag-over-bottom');
   if (!draggedBoardId || draggedBoardId === targetBoardId) return;

   const dragged = getBoard(draggedBoardId);
   if (!dragged) return;

   dragged.categoryId = targetCategoryId || null;

   const list = boardsForCategory(targetCategoryId).filter(b => b.id !== draggedBoardId);
   let targetIdx = list.findIndex(b => b.id === targetBoardId);
   if (targetIdx === -1) targetIdx = list.length;
   else if (insertAfter) targetIdx += 1;
   list.splice(targetIdx, 0, dragged);
   reindexBoardList(list);

   saveState();
   renderSidebar();
  }

  // Dropped onto empty space within a category's board list (not on a specific board) — append to end
  function onCategoryDropZone(e, categoryId) {
   e.preventDefault();
   e.currentTarget.classList.remove('drag-over');
   if (!draggedBoardId) return;

   const dragged = getBoard(draggedBoardId);
   if (!dragged) return;

   dragged.categoryId = categoryId || null;
   const list = boardsForCategory(categoryId).filter(b => b.id !== draggedBoardId);
   list.push(dragged);
   reindexBoardList(list);

   saveState();
   renderSidebar();
  }

  function onCategoryDragStart(e, categoryId) {
   draggedCategoryId = categoryId;
   draggedBoardId = null;
   e.dataTransfer.effectAllowed = 'move';
   e.dataTransfer.setData('text/plain', categoryId);
   e.currentTarget.classList.add('dragging');
  }

  function onCategoryDragOver(e) {
   if (!draggedCategoryId) return;
   e.preventDefault();
   e.dataTransfer.dropEffect = 'move';
   e.currentTarget.classList.add('drag-over');
  }

  function onCategoryDragLeave(e) {
   e.currentTarget.classList.remove('drag-over');
  }

  function onCategoryDrop(e, targetCategoryId) {
   e.preventDefault();
   e.stopPropagation();
   e.currentTarget.classList.remove('drag-over');
   if (!draggedCategoryId || draggedCategoryId === targetCategoryId) return;

   const cats = sortedCategories();
   const fromIdx = cats.findIndex(c => c.id === draggedCategoryId);
   const toIdx = cats.findIndex(c => c.id === targetCategoryId);
   if (fromIdx === -1 || toIdx === -1) return;

   const [moved] = cats.splice(fromIdx, 1);
   cats.splice(toIdx, 0, moved);
   cats.forEach((c, i) => { c.order = i; });

   saveState();
   renderSidebar();
  }

  let draggedAlterId = null;

  function onAlterDragStart(e, alterId) {
   draggedAlterId = alterId;
   e.dataTransfer.effectAllowed = 'move';
   e.dataTransfer.setData('text/plain', alterId);
   e.currentTarget.classList.add('dragging');
  }

  function onAlterDragOver(e) {
   if (!draggedAlterId) return;
   e.preventDefault();
   e.dataTransfer.dropEffect = 'move';
   const rect = e.currentTarget.getBoundingClientRect();
   const after = (e.clientX - rect.left) > rect.width / 2;
   e.currentTarget.classList.remove('drag-over-top', 'drag-over-bottom');
   e.currentTarget.classList.add(after ? 'drag-over-bottom' : 'drag-over-top');
  }

  function onAlterDragLeave(e) {
   e.currentTarget.classList.remove('drag-over-top', 'drag-over-bottom');
  }

  function onAlterDrop(e, targetAlterId) {
   e.preventDefault();
   e.stopPropagation();
   const dropEl = e.currentTarget;
   const insertAfter = dropEl.classList.contains('drag-over-bottom');
   dropEl.classList.remove('drag-over-top', 'drag-over-bottom');
   if (!draggedAlterId || draggedAlterId === targetAlterId) return;

   // Manual reordering only makes sense in manual sort mode.
   state.alterSort = 'manual';

   const list = sortAlters(state.alters.filter(a => !a.archived)).filter(a => a.id !== draggedAlterId);
   const dragged = getAlter(draggedAlterId);
   if (!dragged) return;
   let targetIdx = list.findIndex(a => a.id === targetAlterId);
   if (targetIdx === -1) targetIdx = list.length;
   else if (insertAfter) targetIdx += 1;
   list.splice(targetIdx, 0, dragged);
   list.forEach((a, i) => { a.order = i; });

   saveState();
   renderAlters();
  }

  function onDragEnd() {
   document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
   document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
   document.querySelectorAll('.drag-over-top').forEach(el => el.classList.remove('drag-over-top'));
   document.querySelectorAll('.drag-over-bottom').forEach(el => el.classList.remove('drag-over-bottom'));
   draggedBoardId = null;
   draggedCategoryId = null;
   draggedAlterId = null;
  }
 function archiveBoard(boardId) {
   const board = state.boards.find(b => b.id === boardId);

   if (!board) return;

   board.archived = true;

   saveState();
   renderAll();
  }

  function unarchiveBoard(boardId) {
   const board = state.boards.find(b => b.id === boardId);

   if (!board) return;

   board.archived = false;

   saveState();
   renderAll();
  }

  /* ============================================================
   BOARD ACCESS: passwords + alter-specific restriction
  ============================================================ */
  function canAccessBoard(boardId) {
   const board = getBoard(boardId);
   if (!board) return false;
   if (board.allowedAlterIds && board.allowedAlterIds.length) {
   const fronting = getFrontingIds();
   const allowed = fronting.some(id => board.allowedAlterIds.includes(id));
   if (!allowed) return false;
   }
   if (board.password) {
   if (!Array.isArray(state.unlockedBoards)) state.unlockedBoards = [];
   if (!state.unlockedBoards.includes(boardId)) return false;
   }
   return true;
  }

  function promptBoardUnlock(boardId) {
   const board = getBoard(boardId);
   if (!board) return;
   const fronting = getFrontingIds();
   const restricted = board.allowedAlterIds && board.allowedAlterIds.length && !fronting.some(id => board.allowedAlterIds.includes(id));
   showModal(`
   <div class="modal-header">
   <h2>🔒 ${esc(board.name)}</h2>
   <button class="btn btn-ghost btn-icon" onclick="closeModal()">✕</button>
   </div>
   <div class="modal-body">
   ${restricted ? `<p class="text-muted">This ${t('board')} is only available to specific ${t('alters')} while they're ${t('fronting')}. None of the currently ${t('fronting')} ${t('alters')} are allowed.</p>` : ''}
   ${(board.password && !restricted) ? `
   <div class="form-group">
   <label class="form-label">This ${t('board')} is password protected</label>
   <input class="form-input" id="board-unlock-pw" type="password" placeholder="Enter password" onkeydown="if(event.key==='Enter')submitBoardUnlock('${esc(boardId)}')" />
   </div>
   ` : ''}
   </div>
   <div class="modal-footer">
   <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
   ${(board.password && !restricted) ? `<button class="btn btn-primary" onclick="submitBoardUnlock('${esc(boardId)}')">Unlock</button>` : ''}
   </div>
   `);
  }

  function submitBoardUnlock(boardId) {
   const board = getBoard(boardId);
   if (!board) return;
   const input = document.getElementById('board-unlock-pw');
   const val = input ? input.value : '';
   if (val !== board.password) {
   showToast('Incorrect password');
   return;
   }
   if (!Array.isArray(state.unlockedBoards)) state.unlockedBoards = [];
   state.unlockedBoards.push(boardId);
   saveState();
   closeModal();
   navigate('board', boardId);
  }

  // Mark a board as "seen" by whoever's currently fronting, clearing
  // their unread flag for it and recording when they last viewed it.
  function markBoardSeen(boardId) {
   const fronting = getFrontingIds();
   if (!fronting.length || !boardId) return;
   let changed = false;
   fronting.forEach(aid => {
   const a = getAlter(aid);
   if (!a) return;
   if (!Array.isArray(a.unreadBoardIds)) a.unreadBoardIds = [];
   if (a.unreadBoardIds.includes(boardId)) {
    a.unreadBoardIds = a.unreadBoardIds.filter(id => id !== boardId);
    changed = true;
   }
   if (!Array.isArray(a.lastSeenBoardTimes)) a.lastSeenBoardTimes = [];
   const entry = a.lastSeenBoardTimes.find(e => e.boardId === boardId);
   if (entry) entry.time = Date.now();
   else a.lastSeenBoardTimes.push({ boardId, time: Date.now() });
   changed = true;
   });
   if (changed) saveState();
  }

  // Called whenever a post is made: flags every OTHER alter who has this
  // board allowed (or any alter, for unrestricted boards) as having an
  // unread message there. Surfaces as a toast next time they switch in,
  // and a badge on their alter card.
  function flagUnreadForBoard(boardId, exceptAlterId) {
   const board = getBoard(boardId);
   if (!board) return;
   const targets = (board.allowedAlterIds && board.allowedAlterIds.length)
   ? board.allowedAlterIds
   : state.alters.map(a => a.id);
   targets.forEach(aid => {
   if (aid === exceptAlterId) return;
   const a = getAlter(aid);
   if (!a) return;
   if (!Array.isArray(a.unreadBoardIds)) a.unreadBoardIds = [];
   if (!a.unreadBoardIds.includes(boardId)) a.unreadBoardIds.push(boardId);
   });
   saveState();
  }

  // Shows a toast for any newly-fronting alter who has unread board
  // messages waiting. Called from updateFronting whenever the fronting
  // set changes.
  function checkUnreadToastsForFronting(newIds, oldIds) {
   const justSwitchedIn = newIds.filter(id => !oldIds.includes(id));
   justSwitchedIn.forEach(id => {
   const a = getAlter(id);
   if (!a || !Array.isArray(a.unreadBoardIds) || !a.unreadBoardIds.length) return;
   const names = a.unreadBoardIds.map(bid => { const b = getBoard(bid); return b ? b.name : null; }).filter(Boolean);
   if (!names.length) return;
   showToast(`${esc(a.name)}: unread in ${names.map(esc).join(', ')}`, 4500);
   });
  }

  function renderSidebar() {
   const container = document.getElementById('boards-list');
   if (!container) return;

   const boardsLabel = document.getElementById('sidebar-boards-label');
   if (boardsLabel) boardsLabel.textContent = cap(t('boards'));

   const navAlt = document.getElementById('nav-alters-label');
   if (navAlt) navAlt.textContent = cap(t('alters'));

   const activeBoards = state.boards.filter(b => !b.archived);

   if (!activeBoards.length && !state.categories.length) {
    container.innerHTML =
     `<div style="padding:6px 16px 10px;font-size:0.78rem;color:var(--text-2);font-style:italic;">
     No ${t('boards')} yet
     </div>`;
    return;
   }

   const renderBoardItem = (b, categoryId) => `
    <div
     class="sidebar-item ${currentView === 'board' && state.currentBoardId === b.id ? 'active' : ''}"
     id="board-btn-${esc(b.id)}"
     role="button"
     tabindex="0"
     draggable="true"
     ondragstart="onBoardDragStart(event,'${esc(b.id)}')"

  let frontFilterAlterId = '';

  function renderFront() {

   const openEntries = sorted.filter(e => e.endTime == null);

  function saveFrontEntry(id, isEdit) {
   const checked = Array.from(document.querySelectorAll('.alter-check-item input[type="checkbox"]:checked')).map(cb => cb.value);
   if (!checked.length) { alert(`Select at least one ${t('alter')}.`); return; }

   const startVal = document.getElementById('fe-start').value;
   if (!startVal) { alert('Start time is required.'); return; }
   const startTime = frontInputToTs(startVal);

   const ongoing = document.getElementById('fe-ongoing').checked;
   let endTime = null;
   if (!ongoing) {
   const endVal = document.getElementById('fe-end').value;
   if (endVal) {
    endTime = frontInputToTs(endVal);
    if (endTime <= startTime) { alert('End time must be after the start time.'); return; }
   }
   }

   const notes = document.getElementById('fe-notes').value.trim();
   const prior = isEdit ? state.frontHistory.find(e => e.id === id) : null;

   const mainSel = document.getElementById('fe-main') ? document.getElementById('fe-main').value : null;
   const mainId = checked.includes(mainSel) ? mainSel : checked[0];

   const entry = {
   id,
   alterIds: checked,
   mainId,
   startTime,
   endTime,
   notes,
   createdAt: prior ? (prior.createdAt || Date.now()) : Date.now()
   };

   if (isEdit) {
   const idx = state.frontHistory.findIndex(e => e.id === id);
   if (idx >= 0) state.frontHistory[idx] = entry; else state.frontHistory.push(entry);
   } else {
   // Adding a brand-new ongoing entry should replace whatever was
   // previously marked as the open one, rather than running alongside it.
   if (entry.endTime == null) {
   state.frontHistory.forEach(x => { if (x.endTime == null) x.endTime = entry.startTime; });
   }
   state.frontHistory.push(entry);
   }

   // If we just edited the entry that's currently open, keep the header's
   // notion of who's fronting in sync with it.
   if (entry.endTime == null) {
   state.activeFronterIds = entry.alterIds;
   state.activeFronterId = entry.mainId;
   applyTheme();
   }

   saveState();
   closeModal();
   renderFront();
  }

  function endFrontEntryNow(id) {
   const e = state.frontHistory.find(x => x.id === id);
   if (!e) return;
   e.endTime = Date.now();
   saveState();
   renderFront();
  }

  function deleteFrontEntry(id) {
   if (!confirm('Delete this front history entry? This cannot be undone.')) return;
   state.frontHistory = state.frontHistory.filter(e => e.id !== id);
   saveState();
   closeModal();
   renderFront();
  }

  /* ---- small formatting helpers, scoped to front history ---- */
  function frontTsToInput(ts) {
   const d = new Date(ts);
   const p = n => String(n).padStart(2,'0');
   return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  function frontInputToTs(val) {
   return new Date(val).getTime();
  }
  function formatFrontClock(ts) {
   return new Date(ts).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  }
  function formatFrontFull(ts) {
   return new Date(ts).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  }
  function formatFrontDuration(ms) {
   if (ms < 0) ms = 0;
   const mins = Math.floor(ms / 60000);
   const h = Math.floor(mins / 60);
   const m = mins % 60;
   if (h <= 0) return `${m}m`;
   if (h < 24) return `${h}h ${m}m`;
   const d = Math.floor(h / 24), rh = h % 24;
   return `${d}d ${rh}h`;
  }
  function frontDayKey(ts) {
   const d = new Date(ts);
   return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  }
  function frontDayLabel(ts) {
   const d = new Date(ts);
   const now = new Date();
   const startOfDay = dt => new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()).getTime();
   const diffDays = Math.round((startOfDay(now) - startOfDay(d)) / 86400000);
   if (diffDays === 0) return 'Today';
   if (diffDays === 1) return 'Yesterday';
   return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: d.getFullYear() !== now.getFullYear() ? 'numeric' : undefined });
  }
  function groupFrontEntriesByDay(entries) {
   const groups = [];
   let key = null, group = null;
   entries.forEach(e => {
   const k = frontDayKey(e.startTime);
   if (k !== key) {
    group = { label: frontDayLabel(e.startTime), entries: [] };
    groups.push(group);
    key = k;
   }
   group.entries.push(e);
   });
   return groups;
  }

  /* ============================================================
   RENDER: ALTERS VIEW
  ============================================================ */
  function getMostRecentFrontTime(alterId) {
   let latest = 0;
   (state.frontHistory||[]).forEach(e => {
   if ((e.alterIds||[]).includes(alterId)) {
    const tm = e.endTime || e.startTime || 0;
    if (tm > latest) latest = tm;
   }
   });
   return latest;
  }

  function sortAlters(list) {
   const sort = state.alterSort || 'manual';
   const arr = [...list];
   if (sort === 'alpha') {
   arr.sort((a,b) => a.name.localeCompare(b.name));
   } else if (sort === 'recent') {
   arr.sort((a,b) => getMostRecentFrontTime(b.id) - getMostRecentFrontTime(a.id));
   } else {
   arr.sort((a,b) => (a.order||0) - (b.order||0));
   }
   return arr;
  }

  function renderAlters() {
   const container = document.getElementById('view-alters');
   const search = (state.alterSearch || '').toLowerCase().trim();
   const showArchived = !!state.showArchivedAlters;
   let alters = state.alters.filter(a => a.name.toLowerCase().includes(search) && !!a.archived === showArchived);
   alters = sortAlters(alters);
   const density = state.alterDensity || 'comfy';
   const DENSITY = ALTER_DENSITY[density] || ALTER_DENSITY.comfy;

   container.innerHTML = `
  <div class="page-header">
  <div class="page-title-dot"></div>
  <h1>${esc(state.systemName)} — ${showArchived ? 'Archived ' : ''}${cap(t('alters'))}</h1>
  <input id="alter-search-input" class="form-input" style="flex:1;min-width:160px;max-width:280px" type="text" placeholder="Search ${cap(t('alters'))}" value="${esc(state.alterSearch || '')}" oninput="updateAlterSearch(this.value)">

  <select class="form-select" style="max-width:160px" onchange="setAlterSort(this.value)">
   <option value="manual" ${state.alterSort==='manual'?'selected':''}>Manual order</option>
   <option value="alpha" ${state.alterSort==='alpha'?'selected':''}>Alphabetical</option>
   <option value="recent" ${state.alterSort==='recent'?'selected':''}>Recently fronting</option>
  </select>

  <div class="density-switch" role="group" aria-label="Card density">
   ${Object.keys(ALTER_DENSITY).map(key => `
   <button class="density-btn ${density===key?'active':''}" title="${esc(ALTER_DENSITY[key].label)} — ${esc(ALTER_DENSITY[key].hint)}" onclick="setAlterDensity('${key}')">${esc(ALTER_DENSITY[key].icon)}</button>
   `).join('')}
  </div>

  <button class="btn btn-secondary btn-sm" onclick="toggleAlterArchiveView()">
  ${showArchived ? '← Back to ' + t('alters') : '🗄 Archive'}
  </button>

  ${!showArchived ? `<button class="btn btn-secondary btn-sm" onclick="openGroupModal()">New Group</button>` : ''}
  ${!showArchived ? `<button class="btn btn-primary btn-sm" onclick="openAlterModal()">New ${t('alter')}</button>` : ''}
  </div>

  ${(!showArchived && state.groups && state.groups.length) ? `
  <div class="group-section">
  <div class="group-grid">
  ${state.groups.map(g => renderGroupCard(g)).join('')}
  </div>
  </div>
  ` : ''}

  ${!alters.length ? `
  <div class="empty-state">
  <div class="empty-title">${showArchived ? `No archived ${t('alters')}` : `No matching ${t('alters')}`}</div>
  </div>
  ` : `
  <div class="card-grid density-${density}" style="grid-template-columns:repeat(auto-fill, minmax(${DENSITY.minWidth}px, 1fr));gap:${DENSITY.gap}px;">
  ${alters.map(a => renderAlterCard(a, DENSITY)).join('')}
  </div>
  `}`;
  }

  // Density presets for the alter grid. Each step down hides progressively
  // more of the card so large systems (50+ alters) can fit a usable
  // overview on screen instead of just shrinking text into illegibility.
  const ALTER_DENSITY = {
   comfy:   { label: 'Comfy',   icon: '▢',  hint: 'Full cards with everything', minWidth: 220, gap: 14, avatarSize: 48,
        showRealname: true, showPronouns: true, showRole: true, showProxy: true, showNotes: true, showActions: true, showPostCount: true, nameSize: '1rem' },
   compact: { label: 'Compact', icon: '▦',  hint: 'Drops notes preview, smaller avatar', minWidth: 170, gap: 10, avatarSize: 36,
        showRealname: true, showPronouns: true, showRole: true, showProxy: true, showNotes: false, showActions: true, showPostCount: true, nameSize: '0.92rem' },
   mini:    { label: 'Mini',    icon: '▪︎▪︎', hint: 'Avatar, name + role only — one action button', minWidth: 120, gap: 8, avatarSize: 28,
        showRealname: false, showPronouns: false, showRole: true, showProxy: false, showNotes: false, showActions: 'one', showPostCount: false, nameSize: '0.85rem' },
   tiny:    { label: 'Tiny',    icon: '·',  hint: 'Just avatar + name, tap for everything else', minWidth: 84, gap: 6, avatarSize: 22,
        showRealname: false, showPronouns: false, showRole: false, showProxy: false, showNotes: false, showActions: false, showPostCount: false, nameSize: '0.74rem' }
  };

  function toggleAlterArchiveView() {
   state.showArchivedAlters = !state.showArchivedAlters;
   saveState();
   renderAlters();
  }

  function setAlterSort(value) {
   state.alterSort = value;
   saveState();
   renderAlters();
  }

  function setAlterDensity(value) {
   if (!ALTER_DENSITY[value]) return;
   state.alterDensity = value;
   saveState();
   renderAlters();
  }

  function updateAlterSearch(value) {
   state.alterSearch = value;
   const input = document.getElementById('alter-search-input');
   const cursor = input ? input.selectionStart : null;
   renderAlters();
   const newInput = document.getElementById('alter-search-input');
   if (newInput) {
   newInput.focus();
   if (cursor !== null) {
   try { newInput.setSelectionRange(cursor, cursor); } catch(e) {}
   }
   }
  }
  function renderGroupCard(g) {
   const count = state.alters.filter(a => (a.groupIds||[]).includes(g.id) && !a.archived).length;
   return `
   <div class="group-card" style="--accent:${esc(g.color)};border-left-color:${esc(g.color)};" onclick="openGroupViewModal('${esc(g.id)}')">
   <div class="group-card-name"><span class="group-card-dot" style="background:${esc(g.color)}"></span>${esc(g.name || 'Untitled group')}</div>
   <div class="group-card-count">${count} ${count===1?t('alter'):t('alters')}</div>
   ${g.description ? `<div class="group-card-desc">${esc(g.description)}</div>` : ''}
   </div>
   `;
  }

  function openGroupModal(id) {
   const group = id ? getGroup(id) : null;
   const isEdit = !!group;
   const g = group || { id: uid(), name: '', color: PRESET_COLORS[Math.floor(Math.random()*PRESET_COLORS.length)], description: '' };

   showModal(`
   <div class="modal-header">
   <h2>${isEdit ? 'Edit' : 'New'} Group</h2>
   <button class="btn btn-ghost btn-icon" onclick="closeModal()">✕</button>
   </div>
   <div class="modal-body">
   <div class="form-group">
   <label class="form-label">Name *</label>
   <input class="form-input" id="g-name" value="${esc(g.name)}" placeholder="e.g. Protectors, Littles…" />
   </div>
   <div class="form-group">
   <label class="form-label">Colour</label>
   <div class="form-color-row">
   <input type="color" class="form-color" id="g-color" value="${esc(g.color)}" oninput="syncGroupColorPresets(this.value)" />
   <div class="color-presets" id="group-presets">
   ${PRESET_COLORS.map(c=>`<div class="color-preset ${c===g.color?'selected':''}" style="background:${c}" onclick="document.getElementById('g-color').value='${c}';syncGroupColorPresets('${c}')"></div>`).join('')}
   </div>
   </div>
   </div>
   <div class="form-group">
   <label class="form-label">Description</label>
   <textarea class="form-textarea" id="g-desc" placeholder="Optional description…">${esc(g.description||'')}</textarea>
   </div>
   ${isEdit ? `
   <div class="form-group">
   <label class="form-label">Members</label>
   <div class="group-checkbox-list">
   ${state.alters.filter(a=>!a.archived).map(a => `
    <label class="group-checkbox-item">
    <input type="checkbox" data-alter-id="${esc(a.id)}" ${ (a.groupIds||[]).includes(g.id) ? 'checked' : '' } onchange="toggleAlterInGroup('${esc(a.id)}','${esc(g.id)}',this.checked)" />
    ${esc(a.displayName && a.displayName.trim() ? a.displayName.trim() : a.name)}
    </label>
   `).join('') || '<span class="text-muted">No alters yet.</span>'}
   </div>
   <div class="form-hint">Toggling here saves immediately. You can also assign groups from each ${t('alter')}'s edit screen.</div>
   </div>
   ` : ''}
   </div>
   <div class="modal-footer">
   ${isEdit ? `<button class="btn btn-danger btn-sm" onclick="deleteGroup('${esc(g.id)}')">Delete</button>` : ''}
   <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
   <button class="btn btn-primary" onclick="saveGroup('${esc(g.id)}',${isEdit})">Save</button>
   </div>
   `);
  }

  function syncGroupColorPresets(color) {
   document.querySelectorAll('#group-presets .color-preset').forEach(el => {
   const c = el.style.background;
   el.classList.toggle('selected', c === color || el.style.backgroundColor === color);
   });
  }

  function toggleAlterInGroup(alterId, groupId, checked) {
   const a = getAlter(alterId);
   if (!a) return;
   if (!Array.isArray(a.groupIds)) a.groupIds = [];
   if (checked && !a.groupIds.includes(groupId)) a.groupIds.push(groupId);
   if (!checked) a.groupIds = a.groupIds.filter(id => id !== groupId);
   saveState();
  }

  function saveGroup(id, isEdit) {
   const name = document.getElementById('g-name').value.trim();
   if (!name) { alert('Name is required.'); return; }
   const existing = isEdit ? (getGroup(id) || {}) : {};
   const group = {
   ...existing,
   id,
   name,
   color: document.getElementById('g-color').value,
   description: document.getElementById('g-desc').value.trim(),
   createdAt: existing.createdAt || Date.now()
   };
   if (!Array.isArray(state.groups)) state.groups = [];
   if (isEdit) {
   const idx = state.groups.findIndex(g => g.id === id);
   if (idx >= 0) state.groups[idx] = group; else state.groups.push(group);
   } else {
   state.groups.push(group);
   }
   saveState(); closeModal(); renderAll();
  }

  function deleteGroup(id) {
   if (!confirm('Delete this group? This will remove it from any alters in it, but the alters themselves stay.')) return;
   state.groups = (state.groups || []).filter(g => g.id !== id);
   state.alters.forEach(a => { a.groupIds = (a.groupIds || []).filter(gid => gid !== id); });
   saveState(); closeModal(); renderAll();
  }

  function openGroupViewModal(id) {
   const g = getGroup(id);
   if (!g) return;
   const members = state.alters.filter(a => (a.groupIds||[]).includes(id));
   showModal(`
   <div class="modal-header">
   <h2 style="display:flex;align-items:center;gap:8px;"><span class="group-card-dot" style="background:${esc(g.color)}"></span>${esc(g.name)}</h2>
   <button class="btn btn-ghost btn-icon" onclick="closeModal()">✕</button>
   </div>
   <div class="modal-body">
   ${g.description ? `<div class="detail-row"><div class="detail-label">Description</div><div class="detail-value detail-value-pre">${esc(g.description)}</div></div>` : ''}
   <div class="detail-row">
   <div class="detail-label">Members</div>
   <div class="detail-value">
   ${members.length ? members.map(a => `<span class="tag" style="margin:2px 4px 2px 0;cursor:pointer;background:${esc(a.color)}28;color:${esc(a.color)};" onclick="openAlterViewModal('${esc(a.id)}')">${esc(a.displayName && a.displayName.trim() ? a.displayName.trim() : a.name)}</span>`).join('') : '<span class="text-muted">No alters in this group yet.</span>'}
   </div>
   </div>
   </div>
   <div class="modal-footer">
   <button class="btn btn-danger btn-sm" onclick="deleteGroup('${esc(g.id)}')">Delete</button>
   <button class="btn btn-secondary" onclick="closeModal()">Close</button>
   <button class="btn btn-primary" onclick="openGroupModal('${esc(g.id)}')">Edit</button>
   </div>
   `);
  }

  function renderAlterCard(a, density) {
   density = density || ALTER_DENSITY[state.alterDensity || 'comfy'];
   const frontIds = getFrontingIds();
   const isFronting = frontIds.includes(a.id);
   const isMain = a.id === state.activeFronterId;
   const postCount = state.posts.filter(p => p.alterId === a.id).length;
   const hasDisplayName = a.displayName && a.displayName.trim() && a.displayName.trim() !== a.name;
   const unreadCount = (a.unreadBoardIds || []).length;
   const draggable = state.alterSort === 'manual' && !a.archived;
   const isTiny = !density.showRole && !density.showActions;

   // Tiny mode: no action buttons rendered at all, no head/name split —
   // just an avatar stack and name, click still opens the full detail modal.
   if (isTiny) {
   return `
   <div class="alter-card alter-card-tiny ${isFronting ? 'fronting' : ''}" style="--accent:${esc(a.color)};--accent-dim:${esc(a.color)}28;--accent-text:${accentText(a.color)};"
   draggable="${draggable}"
   ondragstart="onAlterDragStart(event,'${esc(a.id)}')"
   ondragover="onAlterDragOver(event)"
   ondragleave="onAlterDragLeave(event)"
   ondrop="onAlterDrop(event,'${esc(a.id)}')"
   ondragend="onDragEnd()"
   onclick="openAlterViewModal('${esc(a.id)}')" title="${esc(hasDisplayName ? a.displayName.trim() : a.name)}">
   ${unreadCount ? `<div class="alter-unread-badge alter-unread-badge-tiny" title="Unread in ${unreadCount} board${unreadCount>1?'s':''}">${unreadCount}</div>` : ''}
   ${isFronting ? `<div class="alter-tiny-front-dot" title="${cap(t('fronting'))}${isMain ? ' · Main' : ''}"></div>` : ''}
   ${alterAvatarHTML(a, density.avatarSize)}
   <div class="alter-name" style="font-size:${density.nameSize};text-align:center;">${esc(hasDisplayName ? a.displayName.trim() : a.name)}</div>
   </div>
   `;
   }

   const actionsHTML = (() => {
   if (!density.showActions) return '';
   if (a.archived) {
    return `<button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();unarchiveAlter('${esc(a.id)}')">Restore</button>`;
   }
   if (density.showActions === 'one') {
    // Mini mode: collapse to a single context-appropriate action.
    return isFronting
    ? `<button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();toggleFrontMember('${esc(a.id)}')">Step down</button>`
    : `<button class="btn btn-sm" style="background:${esc(a.color)}1a;color:${esc(a.color)};border:1px solid ${esc(a.color)}40;" onclick="event.stopPropagation();toggleFrontMember('${esc(a.id)}')">${cap(t('fronting'))}</button>`;
   }
   return `
    <button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();openAlterModal('${esc(a.id)}')">Edit</button>
    ${isFronting
    ? `<button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();toggleFrontMember('${esc(a.id)}')">Step down</button>` +
     (isMain ? '' : `<button class="btn btn-sm" style="background:${esc(a.color)}1a;color:${esc(a.color)};border:1px solid ${esc(a.color)}40;" onclick="event.stopPropagation();setMainFronter('${esc(a.id)}')">Make main</button>`)
    : `<button class="btn btn-sm" style="background:${esc(a.color)}1a;color:${esc(a.color)};border:1px solid ${esc(a.color)}40;" onclick="event.stopPropagation();toggleFrontMember('${esc(a.id)}')">Set ${cap(t('fronting'))}</button>`}
   `;
   })();

   return `
   <div class="alter-card ${isFronting ? 'fronting' : ''}" style="--accent:${esc(a.color)};--accent-dim:${esc(a.color)}28;--accent-text:${accentText(a.color)};"
   draggable="${draggable}"
   ondragstart="onAlterDragStart(event,'${esc(a.id)}')"
   ondragover="onAlterDragOver(event)"
   ondragleave="onAlterDragLeave(event)"
   ondrop="onAlterDrop(event,'${esc(a.id)}')"
   ondragend="onDragEnd()"
   onclick="openAlterViewModal('${esc(a.id)}')">
   <div style="position:absolute;top:0;left:0;right:0;height:4px;background:${esc(a.color)};border-radius:var(--radius) var(--radius) 0 0;"></div>
   ${isFronting ? `<div class="tag alter-fronting-badge">${cap(t('fronting'))}${isMain ? ' · Main' : ''}</div>` : ''}
   ${unreadCount ? `<div class="alter-unread-badge" title="Unread in ${unreadCount} board${unreadCount>1?'s':''}">${unreadCount}</div>` : ''}
   <div class="alter-card-head">
   ${alterAvatarHTML(a, density.avatarSize)}
   <div style="min-width:0;padding-top:1px;">
   <div class="alter-name" style="font-size:${density.nameSize};">${esc(hasDisplayName ? a.displayName.trim() : a.name)}</div>
   ${density.showRealname && hasDisplayName ? `<div class="alter-realname">${esc(a.name)}</div>` : ''}
   ${density.showPronouns && state.settings.showPronouns && a.pronouns ? `<div class="alter-pronouns">${esc(a.pronouns)}</div>` : ''}
   </div>
   </div>
   ${density.showRole && state.settings.showRole && a.role ? `<div class="alter-role" style="color:${esc(a.color)}">${esc(a.role)}</div>` : ''}
   ${density.showProxy && (a.proxyTags && a.proxyTags.length) ? `<div class="alter-proxy-tags">${renderProxyTagChips(a.proxyTags)}</div>` : ''}
   ${density.showNotes && a.notes ? `<div class="text-sm text-muted mt-1" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(a.notes)}</div>` : ''}
   ${actionsHTML ? `
   <div class="post-actions mt-2">
   ${actionsHTML}
   ${density.showPostCount ? `<span class="badge">${postCount} ${t('posts')}</span>` : ''}
   </div>
   ` : ''}   </div>
   `;
  }

  /* ============================================================
   ALTER VIEW (READ-ONLY DETAIL) MODAL
   Clicking an alter card opens this — everything PluralKit-style
   that's stored about the alter, with no risk of accidentally
   editing it. Edit/Delete still live one tap away.
  ============================================================ */
  function openAlterViewModal(id) {
   const a = getAlter(id);
   if (!a) return;
   const frontIds = getFrontingIds();
   const isFronting = frontIds.includes(a.id);
   const isMain = a.id === state.activeFronterId;
   const postCount = state.posts.filter(p => p.alterId === a.id).length;
   const hasDisplayName = a.displayName && a.displayName.trim() && a.displayName.trim() !== a.name;
   const displayTitle = hasDisplayName ? a.displayName.trim() : a.name;

   showModal(`
   <div class="profile-modal-banner" style="${alterBannerStyle(a)}">
   <button class="profile-modal-close" onclick="closeModal()" title="Close" aria-label="Close">✕</button>
   ${a.archived ? `<span class="profile-modal-archived-tag">Archived</span>` : ''}
   </div>
   <div class="profile-modal-header">
   <div class="profile-modal-avatar-ring">${alterAvatarHTML(a, 64)}</div>
   <div class="profile-modal-titles">
   <div class="profile-modal-name">${esc(displayTitle)}</div>
   ${hasDisplayName ? `<div class="profile-modal-realname">${esc(a.name)}</div>` : ''}
   </div>
   ${isFronting ? `<span class="tag profile-modal-front-pill" style="background:${esc(a.color)}28;color:${esc(a.color)};">${isMain ? '⭐ Main' : '🟢 ' + cap(t('fronting'))}</span>` : ''}
   </div>

   <div class="modal-body" style="padding-top:0;">
   <div class="profile-pills">
   ${a.pronouns ? `<span class="profile-pill">${esc(a.pronouns)}</span>` : ''}
   ${a.role ? `<span class="profile-pill" style="background:${esc(a.color)}1f;color:${esc(a.color)};">🎭 ${esc(a.role)}</span>` : ''}
   ${a.birthday ? `<span class="profile-pill">🎂 ${esc(formatBirthday(a.birthday))}</span>` : ''}
   <span class="profile-pill"><span class="profile-pill-swatch" style="background:${esc(a.color)}"></span>${esc((a.color||'').toUpperCase())}</span>
   </div>

   ${(a.unreadBoardIds && a.unreadBoardIds.length) ? `
   <div class="profile-section">
   <div class="profile-section-label">Unread</div>
   ${a.unreadBoardIds.map(bid => { const b = getBoard(bid); return b ? `<span class="tag" style="margin:2px 4px 2px 0;cursor:pointer;" onclick="closeModal();navigate('board','${esc(bid)}')">${esc(b.name)}</span>` : ''; }).join('')}
   </div>
   ` : ''}

   <div class="profile-section">
   <div class="profile-section-label">Proxy Tags</div>
   ${(a.proxyTags && a.proxyTags.length) ? `
   <div class="alter-proxy-tags" style="margin-top:0;">${renderProxyTagChips(a.proxyTags)}</div>
   <div class="form-hint mt-1">${a.keepProxy ? 'Keeps' : 'Strips'} the proxy tags in the proxied message.</div>
   ` : `<span class="text-muted text-sm">None set</span>`}
   </div>

   ${a.notes ? `
   <div class="profile-section">
   <div class="profile-section-label">Description</div>
   <div class="profile-section-body">${esc(a.notes)}</div>
   </div>` : ''}

   ${(state.systemFields && state.systemFields.length) ? `
   <div class="profile-section">
   <div class="profile-section-label">Custom Fields</div>
   <div class="profile-field-grid">
   ${state.systemFields.map(field => {
    const val = getAlterFieldValue(a, field.id);
    const display = field.type === 'checkbox' ? (val === 'true' ? 'Yes' : 'No') : (val ? esc(val) : '—');
    return `<div class="profile-field-chip"><div class="profile-field-chip-label">${esc(field.name || 'Untitled field')}</div><div class="profile-field-chip-value">${display}</div></div>`;
   }).join('')}
   </div>
   </div>` : ''}

   ${(a.groupIds && a.groupIds.length) ? `
   <div class="profile-section">
   <div class="profile-section-label">Groups</div>
   <div class="alter-group-tags">
   ${alterGroups(a).map(g => `<span class="tag alter-group-tag" style="background:${esc(g.color)}28;color:${esc(g.color)};" onclick="closeModal();openGroupViewModal('${esc(g.id)}')">${esc(g.name)}</span>`).join('')}
   </div>
   </div>
   ` : ''}

   <div class="profile-section">
   <div class="profile-footnote">${postCount} ${t('posts')} · created ${fmt(a.createdAt)}${a.pkId ? ` · linked to PluralKit member <code>${esc(a.pkId)}</code>` : ''}</div>
   </div>
   </div>
   <div class="modal-footer" style="justify-content:space-between;flex-wrap:wrap;">
   <div style="display:flex;gap:8px;flex-wrap:wrap;">
   ${a.archived ? '' : (isFronting
    ? `<button class="btn btn-sm btn-ghost" onclick="toggleFrontMember('${esc(a.id)}');closeModal();">Step down</button>` +
     (isMain ? '' : `<button class="btn btn-sm" style="background:${esc(a.color)}1a;color:${esc(a.color)};border:1px solid ${esc(a.color)}40;" onclick="setMainFronter('${esc(a.id)}');closeModal();">Make main</button>`)
    : `<button class="btn btn-sm" style="background:${esc(a.color)}1a;color:${esc(a.color)};border:1px solid ${esc(a.color)}40;" onclick="toggleFrontMember('${esc(a.id)}');closeModal();">Set ${cap(t('fronting'))}</button>`)}
   ${a.archived
    ? `<button class="btn btn-sm btn-secondary" onclick="unarchiveAlter('${esc(a.id)}')">Restore from archive</button>`
    : `<button class="btn btn-sm btn-ghost" onclick="archiveAlter('${esc(a.id)}')">Archive</button>`}
   </div>
   <div style="display:flex;gap:8px;">
   <button class="btn btn-secondary" onclick="closeModal()">Close</button>

  function applyPostSearch() {
   postSearch.query   = (document.getElementById('ps-query')   || {}).value || '';
   postSearch.alterId = (document.getElementById('ps-alter')   || {}).value || '';
   postSearch.dateFrom= (document.getElementById('ps-datefrom')|| {}).value || '';
   postSearch.dateTo  = (document.getElementById('ps-dateto')  || {}).value || '';
   renderBoard();
  }

  function clearPostSearch() {
   postSearch = { query: '', alterId: '', dateFrom: '', dateTo: '', open: false };
   renderBoard();
  }

  function filterPostsBySearch(posts) {
   let list = [...posts];
   const q = postSearch.query.trim().toLowerCase();
   if (q) list = list.filter(p => p.content && p.content.toLowerCase().includes(q));
   if (postSearch.alterId) list = list.filter(p => p.alterId === postSearch.alterId);
   if (postSearch.dateFrom) {
   const from = new Date(postSearch.dateFrom).getTime();
   if (!isNaN(from)) list = list.filter(p => p.timestamp >= from);
   }
   if (postSearch.dateTo) {
   const to = new Date(postSearch.dateTo).getTime() + 86399999; // end of that day
   if (!isNaN(to)) list = list.filter(p => p.timestamp <= to);
   }
   return list;
  }

   return !!(postSearch.query || postSearch.alterId || postSearch.dateFrom || postSearch.dateTo);
  }

  /* ============================================================
   THREADED POST BUILDER
   Recursively builds a flat list of { post, depth } objects
   for Reddit-style nesting. Depth caps visual treatment at 3+.
  ============================================================ */
  function buildThreadedPostList(topLevelPosts, allBoardPosts) {
   const result = [];
   function walk(posts, depth) {
   posts.forEach(p => {
    result.push({ post: p, depth });
    const children = allBoardPosts
    .filter(c => c.parentId === p.id)
    .sort((a,b) => a.timestamp - b.timestamp);
    if (children.length) walk(children, depth + 1);
   });
   }
   walk(topLevelPosts, 0);
   return result;
  }

   <div class="post-gallery-img-wrap" onclick="openImageLightbox('${src.replace(/'/g, "\\'")}')">
   <img src="${esc(src)}" alt="" loading="lazy" />
   </div>
   `).join('')}
   </div>
   ${!single ? `<div class="post-gallery-count">${images.length} images — swipe to see more</div>` : ''}
   `;
  }

  }function renderReactions(post) {
   if (!post.reactions)
   post.reactions = {};

   return Object.entries(post.reactions)
   .map(([emoji, users]) => `
   <button
   class="reaction-chip"
   onclick="toggleReaction('${post.id}','${emoji}')"
   >
   ${emoji} ${users.length}

   .join('');
  }
  function toggleReaction(postId, emoji) {
   const post =
   state.posts.find(p => p.id === postId);

   if (!post)
   return;

   if (!post.reactions)
   post.reactions = {};

   if (!post.reactions[emoji])
   post.reactions[emoji] = [];

   const users =
   post.reactions[emoji];

   const idx =
   users.indexOf(state.activeFronterId);

   if (idx >= 0)
   users.splice(idx, 1);
   else
   users.push(state.activeFronterId);

   if (users.length === 0)
   delete post.reactions[emoji];

   saveState();
   renderBoard();
  }

  function submitPost() {
   const input = document.getElementById('compose-input');
   const content = input ? input.value.trim() : '';
   const images = composeStagedImages.slice();

   if (
   (!content && !images.length) ||
   !state.activeFronterId ||
   !state.currentBoardId
   ) {
   return;
   }

   const post = {
   id: uid(),
   boardId: state.currentBoardId,
   alterId: state.activeFronterId,
   content,
   images,
   timestamp: Date.now(),
   reactions: {},
   pinned: false,
   parentId: currentReplyParentId
   };

   state.posts.unshift(post);

   flagUnreadForBoard(state.currentBoardId, state.activeFronterId);
   markBoardSeen(state.currentBoardId);

   saveState();

   input.value = '';
   input.placeholder = `Write a ${t('post')}...`;
   composeStagedImages = [];

   const banner = document.getElementById('reply-banner');
   if (banner) banner.remove();

   const p = state.posts.find(p => p.id === id);

   const ta = document.getElementById('edit-post-content');
   const val = ta ? ta.value.trim() : '';

   p.content = val;

  function showSettingsTab(tab, btn) {
   ['general','appearance','accessibility','terminology','pluralkit','data'].forEach(t => {
   const el = document.getElementById('stab-'+t);
   if (el) el.classList.toggle('hidden', t !== tab);
   });
   document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
   if (btn) btn.classList.add('active');
  }

  function changeSetting(key, val) {
   state.settings[key] = val;
   saveState();
   applyTheme();
  }

  function setDefaultAccent(color) {
   // Only applies if no fronter
   if (!state.activeFronterId) {
   document.documentElement.style.setProperty('--accent', color);
   document.documentElement.style.setProperty('--accent-text', accentText(color));
   document.documentElement.style.setProperty('--accent-dim', color+'28');
   }
   document.querySelectorAll('#default-presets .color-preset').forEach(el => {
   el.classList.toggle('selected', el.style.background === color || el.getAttribute('style').includes(color));
   });
  }

  function resetTerminology() {
   if (!confirm('Reset all terminology to defaults?')) return;
   state.terminology = { ...DEFAULT_TERMINOLOGY };
   saveState(); renderAll();
  }

  /* ============================================================
   PLURALKIT INTEGRATION
   Talks directly to the PluralKit v2 API so a system token entered
   in Settings can push/pull alters and front history. The token is
   stored the same way as everything else in Paracosm (localStorage,
   this browser only) and is only ever sent to api.pluralkit.me.
  ============================================================ */
  const PK_API_BASE = 'https://api.pluralkit.me/v2';
  let pkBusy = false;

  function pkConfigured() { return !!(state.pluralkit && state.pluralkit.token); }

  async function pkFetch(path, opts) {
   opts = opts || {};
   const headers = { 'Authorization': state.pluralkit.token };
   if (opts.body) headers['Content-Type'] = 'application/json';
   let res;
   try {
   res = await fetch(PK_API_BASE + path, {
    method: opts.method || 'GET',
    headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined
   });
   } catch (networkErr) {
   throw new Error('Could not reach the PluralKit API. Check your connection.');
   }
   if (res.status === 204) return null;
   const text = await res.text();
   let data = null;
   if (text) { try { data = JSON.parse(text); } catch(e) { data = text; } }
   if (!res.ok) {
   const msg = (data && data.message) ? data.message : (res.status + ' ' + res.statusText);
   const err = new Error(msg);
   err.status = res.status;
   throw err;
   }
   return data;
  }

  function pkFriendlyError(err) {
   if (err.status === 401 || err.status === 403) return 'That token was rejected. Double-check it and try again.';
   if (err.status === 429) return 'Rate limited by PluralKit. Wait a moment and try again.';
   if (err.status === 404) return 'Not found.';
   return err.message || 'Something went wrong.';
  }

  function pkDelay() { return new Promise(r => setTimeout(r, 350)); }

  function pkProxyTagsFromApi(tags) {
   return Array.isArray(tags) ? tags.map(tg => ({ prefix: tg.prefix || '', suffix: tg.suffix || '' })) : [];
  }

  function setPkStatus(msg) {
   const el = document.getElementById('pk-status-line');
   if (el) el.textContent = msg || '';
  }

  function pkToggleTokenVisibility() {
   const inp = document.getElementById('pk-token-input');
   if (!inp) return;
   inp.type = inp.type === 'password' ? 'text' : 'password';
  }

  async function pkConnect() {
   const tokenEl = document.getElementById('pk-token-input');
   const tok = tokenEl ? tokenEl.value.trim() : '';
   if (!tok) { showToast('Enter your PluralKit token first.'); return; }
   const btn = document.getElementById('pk-connect-btn');
   if (btn) { btn.disabled = true; btn.textContent = 'Connecting…'; }
   const prevToken = state.pluralkit.token;
   state.pluralkit.token = tok;
   try {
   const sys = await pkFetch('/systems/@me');
   state.pluralkit.systemId = sys.id;
   state.pluralkit.systemName = sys.name || sys.id;
   saveState();
   showToast('Connected to PluralKit as ' + (sys.name || sys.id) + '.');
   } catch (err) {
   state.pluralkit.token = prevToken;
   showToast('PluralKit: ' + pkFriendlyError(err), 4200);
   } finally {
   if (btn) { btn.disabled = false; btn.textContent = 'Connect'; }
   renderSettings();
   }
  }

  function pkDisconnect() {
   if (!confirm('Disconnect from PluralKit? This only removes the saved token from this browser — nothing on PluralKit itself is changed or deleted.')) return;
   state.pluralkit = { token:'', systemId:null, systemName:null, lastPushedAt:null, lastPulledAt:null };
   saveState();
   renderSettings();
   showToast('Disconnected from PluralKit.');
  }

  /* ---- alters <-> PluralKit members ---- */

  async function pkPushAlters() {
   if (!pkConfigured()) { showToast('Connect to PluralKit first.'); return; }
   if (pkBusy) return;
   pkBusy = true;
   setPkStatus('Pushing ' + t('alters') + '…');
   let created = 0, updated = 0, failed = 0;
   const appendPronouns = !!(state.pluralkit && state.pluralkit.appendPronounsToDisplayName);
   try {
   for (const a of state.alters) {
    // Build the PK display name. Strip any previously-appended " (pronouns)"
    // suffix first so repeated pushes don't stack them.
    const PRONOUN_SUFFIX_RE = /\s*\([^)]+\)\s*$/;
    let baseName = (a.displayName && a.displayName.trim()) ? a.displayName.trim() : a.name;
    baseName = baseName.replace(PRONOUN_SUFFIX_RE, '').trim(); // strip old suffix if any
    let displayName = (a.displayName && a.displayName.trim()) ? a.displayName.trim().replace(PRONOUN_SUFFIX_RE, '').trim() : null;
    if (appendPronouns && a.pronouns && a.pronouns.trim()) {
    displayName = `${baseName} (${a.pronouns.trim()})`;
    }
    const payload = {
    name: a.name,
    display_name: displayName,
    pronouns: a.pronouns || null,
    color: /^#?[0-9a-fA-F]{6}$/.test(a.color || '') ? a.color.replace('#','').toLowerCase() : null,
    description: a.notes || null,
    avatar_url: a.avatarUrl || null,
    banner: a.banner || null,
    birthday: a.birthday || null,
    proxy_tags: (a.proxyTags || []).map(tg => ({ prefix: tg.prefix || null, suffix: tg.suffix || null })),
    keep_proxy: !!a.keepProxy
    };
    try {
    if (a.pkId) {
     await pkFetch('/members/' + a.pkId, { method:'PATCH', body:payload });
     updated++;
    } else {
     const m = await pkFetch('/members', { method:'POST', body:payload });
     a.pkId = m.id;
     created++;
    }
    } catch (err) { failed++; }
    saveState();
    await pkDelay();
   }
   state.pluralkit.lastPushedAt = Date.now();
   saveState();
   showToast(`Pushed ${t('alters')}: ${created} created, ${updated} updated${failed ? ', ' + failed + ' failed' : ''}.`, 4200);
   } finally {
   pkBusy = false;
   setPkStatus('');
   renderSettings();
   }
  }

  async function pkPullAlters() {
   if (!pkConfigured()) { showToast('Connect to PluralKit first.'); return; }
   if (pkBusy) return;
   pkBusy = true;
   setPkStatus('Pulling ' + t('alters') + '…');
   try {
   const pkMembers = await pkFetch('/systems/@me/members');
   let created = 0, updated = 0;
   pkMembers.forEach(m => {
    const local = state.alters.find(a => a.pkId === m.id);
    if (local) {
    local.name = m.name || local.name;
    if (m.pronouns) local.pronouns = m.pronouns;
    if (m.color) local.color = '#' + m.color;
    if (m.description) local.notes = m.description;
    local.displayName = m.display_name || '';
    local.avatarUrl = m.avatar_url || '';
    local.banner = m.banner || '';
    local.birthday = m.birthday || '';
    local.proxyTags = pkProxyTagsFromApi(m.proxy_tags);
    local.keepProxy = !!m.keep_proxy;
    updated++;
    } else {
    state.alters.push({
     id: uid(), pkId: m.id, name: m.name || 'Unnamed', displayName: m.display_name || '', pronouns: m.pronouns || '', role: '',
     color: m.color ? ('#' + m.color) : PRESET_COLORS[Math.floor(Math.random()*PRESET_COLORS.length)],
     emoji: '', avatarUrl: m.avatar_url || '', banner: m.banner || '', birthday: m.birthday || '',
     proxyTags: pkProxyTagsFromApi(m.proxy_tags), keepProxy: !!m.keep_proxy,
     notes: m.description || '', fieldValues: {}, createdAt: Date.now()
    });
    created++;
    }
   });
   state.pluralkit.lastPulledAt = Date.now();
   saveState();
   renderAll();
   showToast(`Pulled ${t('alters')}: ${created} new, ${updated} updated.`, 4200);
   } catch (err) {
   showToast('PluralKit: ' + pkFriendlyError(err), 4200);
   } finally {
   pkBusy = false;
   setPkStatus('');
   renderSettings();
   }
  }

  /* ---- fronting / switches ---- */

  function pkMappedMemberIds(alterIds) {
   return (alterIds || []).map(id => { const a = getAlter(id); return a && a.pkId; }).filter(Boolean);
  }

  async function pkPushEntryAsSwitch(entry) {
   const members = pkMappedMemberIds(entry.alterIds);
   const sw = await pkFetch('/systems/@me/switches', {
   method: 'POST',
   body: { timestamp: new Date(entry.startTime).toISOString(), members }
   });
   entry.pkSwitchId = sw.id;
   return sw;
  }

  async function pkPushCurrentFront() {
   if (!pkConfigured()) { showToast('Connect to PluralKit first.'); return; }
   const open = state.frontHistory.find(e => e.endTime == null);
   if (!open) { showToast('No one is currently logged as ' + t('fronting') + '.'); return; }
   if (pkBusy) return;
   pkBusy = true;
   setPkStatus('Pushing current ' + t('fronting') + '…');
   try {
   await pkPushEntryAsSwitch(open);
   state.pluralkit.lastPushedAt = Date.now();
   saveState();
   showToast('Current ' + t('fronting') + ' pushed to PluralKit.');
   } catch (err) {
   showToast('PluralKit: ' + pkFriendlyError(err), 4200);
   } finally {
   pkBusy = false;
   setPkStatus('');
   renderSettings();
   }
  }

  async function pkPushFrontHistory() {
   if (!pkConfigured()) { showToast('Connect to PluralKit first.'); return; }
   if (pkBusy) return;
   const unsynced = state.frontHistory.filter(e => !e.pkSwitchId).sort((a,b) => a.startTime - b.startTime);
   if (!unsynced.length) { showToast('Front history is already up to date with PluralKit.'); return; }
   pkBusy = true;
   setPkStatus(`Pushing ${unsynced.length} front history entries…`);
   let ok = 0, failed = 0;
   try {
   for (const entry of unsynced) {
    try { await pkPushEntryAsSwitch(entry); ok++; }
    catch (err) { failed++; }
    saveState();
    await pkDelay();
   }
   state.pluralkit.lastPushedAt = Date.now();
   saveState();
   showToast(`Pushed ${ok} front history entries${failed ? ', ' + failed + ' failed' : ''}.`, 4200);
   } finally {
   pkBusy = false;
   setPkStatus('');
   renderSettings();
   }
  }

  async function pkPullFrontHistory() {
   if (!pkConfigured()) { showToast('Connect to PluralKit first.'); return; }
   if (pkBusy) return;
   pkBusy = true;
   setPkStatus('Pulling front history…');
   try {
   // Make sure every PluralKit member has a local alter to resolve switch
   // members against — auto-creates any that are missing.
   const pkMembers = await pkFetch('/systems/@me/members');
   pkMembers.forEach(m => {
    if (!state.alters.some(a => a.pkId === m.id)) {
    state.alters.push({
     id: uid(), pkId: m.id, name: m.name || 'Unnamed', displayName: m.display_name || '', pronouns: m.pronouns || '', role: '',
     color: m.color ? ('#' + m.color) : PRESET_COLORS[Math.floor(Math.random()*PRESET_COLORS.length)],
     emoji: '', avatarUrl: m.avatar_url || '', banner: m.banner || '', birthday: m.birthday || '',
     proxyTags: pkProxyTagsFromApi(m.proxy_tags), keepProxy: !!m.keep_proxy,
     notes: m.description || '', fieldValues: {}, createdAt: Date.now()
    });
    }
   });

   let switches = [];
   let before = null;
   for (let page = 0; page < 50; page++) {
    const qs = before ? ('?before=' + encodeURIComponent(before)) : '';
    const batch = await pkFetch('/systems/@me/switches' + qs);
    if (!batch || !batch.length) break;
    switches = switches.concat(batch);
    before = batch[batch.length - 1].timestamp;
    if (batch.length < 100) break;
   }

   // PluralKit returns switches newest-first. Each entry's end time is the
   // start time of the switch immediately before it in this list (i.e. the
   // next one chronologically) — the most recent switch has no end time.
   let imported = 0, skipped = 0;
   for (let i = 0; i < switches.length; i++) {
    const sw = switches[i];
    if (state.frontHistory.some(e => e.pkSwitchId === sw.id)) { skipped++; continue; }
    const alterIds = (sw.members || []).map(mid => {
    const a = state.alters.find(x => x.pkId === mid);
    return a ? a.id : null;
    }).filter(Boolean);
    const startTime = new Date(sw.timestamp).getTime();
    const endTime = i === 0 ? null : new Date(switches[i-1].timestamp).getTime();
    state.frontHistory.push({
    id: uid(), pkSwitchId: sw.id, alterIds, mainId: alterIds[0] || null,
    startTime, endTime, notes: '', createdAt: Date.now()
    });
    imported++;
   }

   // Only take over "who's currently fronting" if nothing is set locally —
   // never silently clobber a live local session.
   if (imported && switches.length && !state.activeFronterIds.length) {
    const latest = switches[0];
    const latestIds = (latest.members || []).map(mid => {
    const a = state.alters.find(x => x.pkId === mid);
    return a ? a.id : null;
    }).filter(Boolean);
    state.activeFronterIds = latestIds;
    state.activeFronterId = latestIds[0] || null;
    applyTheme();
   }

   state.pluralkit.lastPulledAt = Date.now();
   saveState();
   renderAll();
   showToast(`Pulled front history: ${imported} new entries${skipped ? ', ' + skipped + ' already synced' : ''}.`, 4200);
   } catch (err) {
   showToast('PluralKit: ' + pkFriendlyError(err), 4200);
   } finally {
   pkBusy = false;
   setPkStatus('');
   renderSettings();
   }
  }

  // One-click sidebar shortcut so people don't have to dig into Settings
  // every time. Chains the same push/pull operations available individually
  // on the PluralKit settings tab — each one only ever creates or updates,
  // never deletes, and skips anything already in sync, so it's safe to run
  // repeatedly back-to-back like this.
  async function pkQuickSync() {
   if (!pkConfigured()) {
   navigate('settings');
   setTimeout(() => {
    const btn = document.querySelector('.tab-btn[onclick*="pluralkit"]');
    showSettingsTab('pluralkit', btn);
   }, 30);
   showToast('Connect to PluralKit first, then try Sync again.', 4000);
   return;
   }
   if (pkBusy) { showToast('A sync is already in progress…'); return; }
   showToast('Syncing with PluralKit…', 2200);
   await pkPushAlters();
   await pkPullAlters();
   await pkPushCurrentFront();
   await pkPushFrontHistory();
   await pkPullFrontHistory();
   showToast('Sync with PluralKit complete ✓', 3000);
  }

 function renderAlterFieldInput(field, alter) {

 }
 if (type === 'checkbox') {
 const isYes = value === 'true';
 return `
 <div class="toggle-wrap">

 <span class="toggle-slider"></span>
 </label>
 <span class="text-sm text-muted toggle-label">${isYes ? 'Yes' : 'No'}</span>

 if (type === 'select') {

 if (!options.length) return `<div class="form-hint">No options have been set for this field yet — add some on the ${t('system')} page.</div>`;
 return `<select class="form-select" id="${id}">${options.map(o => `<option value="${esc(o)}" ${o === value ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
 }
 return `<textarea class="form-textarea" id="${id}" placeholder="Value">${esc(value)}</textarea>`;
 }

   document.querySelectorAll('#alter-presets .color-preset').forEach(el => {

   });

  function saveAlter(id, isEdit) {
   const name = document.getElementById('a-name').value.trim();
   if (!name) { alert('Name is required.'); return; }
   const existing = isEdit ? (getAlter(id) || {}) : {};
   const fieldValues = {};
   (state.systemFields || []).forEach(field => {
   const el = document.getElementById('af-field-' + field.id);
   if (!el) return;
   if (field.type === 'checkbox') fieldValues[field.id] = el.checked ? 'true' : 'false';
   else fieldValues[field.id] = el.value;
   });
   const proxyTags = (alterModalProxyTagsDraft || [])
   .map(tg => ({ prefix: (tg.prefix||'').trim(), suffix: (tg.suffix||'').trim() }))
   .filter(tg => tg.prefix || tg.suffix);
   const groupIds = Array.from(document.querySelectorAll('#alter-groups-editor input[type="checkbox"]:checked')).map(el => el.getAttribute('data-group-id'));
   const alter = {
   ...existing,
   id,
   name,
   displayName: document.getElementById('a-displayname').value.trim(),
   pronouns: document.getElementById('a-pronouns').value.trim(),
   role: document.getElementById('a-role').value.trim(),
   color: document.getElementById('a-color').value,
   emoji: document.getElementById('a-emoji').value.trim(),
   avatarUrl: document.getElementById('a-avatar').value.trim(),
   banner: document.getElementById('a-banner').value.trim(),
   birthday: normalizeBirthdayInput(document.getElementById('a-birthday').value),
   proxyTags,
   keepProxy: document.getElementById('a-keepproxy').checked,
   notes: document.getElementById('a-notes').value.trim(),
   fieldValues,
   groupIds,
   archived: existing.archived || false,
   order: existing.order !== undefined ? existing.order : state.alters.length,
   unreadBoardIds: Array.isArray(existing.unreadBoardIds) ? existing.unreadBoardIds : [],
   lastSeenBoardTimes: Array.isArray(existing.lastSeenBoardTimes) ? existing.lastSeenBoardTimes : [],
   createdAt: existing.createdAt || Date.now()
   };
   if (isEdit) {
   const idx = state.alters.findIndex(a => a.id === id);
   if (idx >= 0) state.alters[idx] = alter; else state.alters.push(alter);
   } else {
   state.alters.push(alter);
   }
   saveState(); closeModal(); renderAll();
   if (state.activeFronterId === id) applyTheme();
  }

  function deleteAlter(id) {
   if (!confirm(`Delete this ${t('alter')}? Their ${t('posts')} will remain.`)) return;
   state.alters = state.alters.filter(a => a.id !== id);
   state.activeFronterIds = getFrontingIds().filter(x => x !== id);
   if (state.activeFronterId === id) state.activeFronterId = state.activeFronterIds[0] || null;
   (state.frontHistory||[]).forEach(e => {
   if (e.endTime == null && (e.alterIds||[]).includes(id)) {
    e.alterIds = e.alterIds.filter(x => x !== id);
    if (e.mainId === id) e.mainId = e.alterIds[0] || null;
    if (!e.alterIds.length) e.endTime = Date.now();
   }
   });
   saveState(); closeModal(); renderAll();
  }

  function archiveAlter(id) {
   const a = getAlter(id);
   if (!a) return;
   a.archived = true;
   // step them down from fronting if they were
   if (getFrontingIds().includes(id)) toggleFrontMember(id);
   saveState(); closeModal(); renderAll();
  }

  function unarchiveAlter(id) {
   const a = getAlter(id);
   if (!a) return;
   a.archived = false;
   saveState(); closeModal(); renderAll();
  }

  function syncBoardPresets(color) {
   document.querySelectorAll('#board-presets .color-preset').forEach(el => {

  function saveBoard(id, isEdit) {
   const name = document.getElementById('b-name').value.trim();

   if (!name) {
   alert('Name is required.');
   return;
   }

   const existing = isEdit ? getBoard(id) : null;
   const categoryId = document.getElementById('b-category').value || null;

   // Spread the existing board first so fields this form doesn't know about
   // (categoryId, order, archived, etc.) survive an edit instead of being wiped.
   const board = {
   ...(existing || {}),
   id,
   name,
   description: document.getElementById('b-desc').value.trim(),
   color: document.getElementById('b-color').value,
   categoryId,
   password: (document.getElementById('b-password').value || '').trim(),
   allowedAlterIds: Array.from(document.querySelectorAll('.b-allowed-alter:checked')).map(el => el.value),
   archived: existing ? !!existing.archived : false,
   createdAt: existing ? (existing.createdAt || Date.now()) : Date.now()
   };

   if (existing) {
   // Category changed — re-rank within the destination category so it
   // doesn't keep a stale order value from its old category.
   if ((existing.categoryId || null) !== categoryId) {
    board.order = boardsForCategory(categoryId).length;
   }
   const idx = state.boards.findIndex(b => b.id === id);
   if (idx >= 0) {
    state.boards[idx] = board;
   } else {
    state.boards.push(board);
   }
   } else {
   board.order = boardsForCategory(categoryId).length;
   state.boards.push(board);
   }

   saveState();
   closeModal();
   renderAll();

   if (!isEdit) {
   navigate('board', id);
   }
  }

  function deleteBoard(id) {
   if (!confirm(`Delete this ${t('board')} and all its ${t('posts')}?`)) return;
   state.boards = state.boards.filter(b => b.id !== id);
   boards = state.boards.filter(b => !b.archived);
   state.posts = state.posts.filter(p => p.boardId !== id);
   if (state.currentBoardId === id) state.currentBoardId = null;
   saveState();
   renderSidebar();
   navigate('alters');
  }

  function deleteCategory(id) {
   const boardCount = state.boards.filter(b => b.categoryId === id && !b.archived).length;

   ? `Delete this category? Its ${boardCount} ${boardCount === 1 ? t('board') : t('boards')} will move to "No category" — they won't be deleted.`
   : 'Delete this category?';
   if (!confirm(msg)) return;

   state.boards.forEach(b => { if (b.categoryId === id) b.categoryId = null; });

  /* ============================================================
   DATA EXPORT / IMPORT
  ============================================================ */
  function exportData() {
   const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
   const url = URL.createObjectURL(blob);
   const a = document.createElement('a');
   a.href = url;
   a.download = `paracosm-${new Date().toISOString().slice(0,10)}.json`;
   a.click();
   URL.revokeObjectURL(url);

   state.lastBackupAt = Date.now();
   state.backupReminderSnoozedUntil = null;
   saveState();
   renderBackupBanner();
   if (currentView === 'settings') renderSettings();
   showToast('Backup downloaded');
  }

  /* ============================================================
   BACKUP REMINDER
   Paracosm only stores data in this browser, so we gently nag people
   to export a JSON backup periodically — see GitHub issue #17.
  ============================================================ */
  function shouldShowBackupReminder() {
   const now = Date.now();
   if (state.backupReminderSnoozedUntil && now < state.backupReminderSnoozedUntil) return false;

   const hasData = state.alters.length > 0 || state.posts.length > 5;
   if (!hasData) return false;

   const DAY = 24 * 60 * 60 * 1000;
   if (!state.lastBackupAt) {
   // Never backed up — give people a few days before nagging on a fresh system.
   return (now - (state.createdAt || now)) > 3 * DAY;
   }
   return (now - state.lastBackupAt) > 30 * DAY;
  }

  function renderBackupBanner() {
   const el = document.getElementById('backup-banner');
   if (!el) return;

   if (!shouldShowBackupReminder()) { el.innerHTML = ''; return; }

   const never = !state.lastBackupAt;
   el.innerHTML = `
   <div class="backup-banner-text">
   <strong>Back up your data</strong> — ${never ? `you haven't exported a backup yet` : `it's been over a month since your last backup (${fmt(state.lastBackupAt)})`}. Everything lives only in this browser, so a crash or a clear-data tap could lose it for good.
   </div>
   <div class="backup-banner-actions">
   <button class="btn btn-primary btn-sm" onclick="exportData()">Back up now</button>
   <button class="btn btn-ghost btn-sm" onclick="snoozeBackupReminder()">Remind me later</button>
   </div>
   `;
  }

  function snoozeBackupReminder() {
   state.backupReminderSnoozedUntil = Date.now() + 7 * 24 * 60 * 60 * 1000;
   saveState();
   renderBackupBanner();
   showToast("Okay — we'll remind you again in a week.");
  }

  let _spImportData = null; // holds parsed SP JSON while modal is open

  function openSpImportModal(event) {
   const file = event.target.files[0];
   if (!file) return;
   event.target.value = '';
   const reader = new FileReader();
   reader.onload = function(e) {
   try {
    const raw = JSON.parse(e.target.result);
    // Accept either a bare array of members or the full SP export object
    let members = [];
    if (Array.isArray(raw)) {
    members = raw;
    } else if (raw && Array.isArray(raw.members)) {
    members = raw.members;
    } else {
    showToast('Could not find members in this file. Make sure you exported from Simply Plural → Settings → Export Data.', 5000);
    return;
    }
    if (!members.length) {
    showToast('No members found in the Simply Plural export.', 4000);
    return;
    }
    _spImportData = members;
    renderSpImportModal(members);
   } catch(err) {
    showToast('Could not read file — make sure it is a valid JSON export from Simply Plural.', 4000);
   }
   };
   reader.readAsText(file);
  }

  function runSpImport() {
   if (!_spImportData) return;
   const members  = _spImportData;
   const conflict = document.getElementById('sp-conflict').value; // 'update' | 'skip'

   // Which fields are ticked? (only tick UI elements that exist = available in file)
   const want = {
   name:     true, // always
   desc:     !!document.getElementById('sp-field-desc')     ?.checked,
   pronouns: !!document.getElementById('sp-field-pronouns') ?.checked,
   color:    !!document.getElementById('sp-field-color')    ?.checked,
   avatar:   !!document.getElementById('sp-field-avatar')   ?.checked,
   };

   let created = 0, updated = 0, skipped = 0;

   members.forEach(m => {
   const rawName = (m.name || '').trim();
   if (!rawName) return; // skip nameless members

   // Try to match an existing alter by name (case-insensitive)
   const existing = state.alters.find(a => a.name.toLowerCase() === rawName.toLowerCase());

   if (existing) {
    if (conflict === 'skip') { skipped++; return; }
    // update
    if (want.desc     && m.desc)     existing.notes    = m.desc;
    if (want.pronouns && m.pronouns) existing.pronouns = m.pronouns;
    if (want.color    && m.color && /^#?[0-9a-fA-F]{6}$/.test(m.color)) {
    existing.color = m.color.startsWith('#') ? m.color : '#' + m.color;
    }
    if (want.avatar   && m.avatarUrl) existing.avatarUrl = m.avatarUrl;
    existing.lastOperationTime = Date.now();
    updated++;
   } else {
    // create new alter
    const color = (want.color && m.color && /^#?[0-9a-fA-F]{6}$/.test(m.color))
    ? (m.color.startsWith('#') ? m.color : '#' + m.color)
    : PRESET_COLORS[Math.floor(Math.random() * PRESET_COLORS.length)];

    const newAlter = {
    id:          uid(),
    name:        rawName,
    displayName: '',
    pronouns:    (want.pronouns && m.pronouns) ? m.pronouns : '',
    role:        '',
    color,
    emoji:       '',
    avatarUrl:   (want.avatar && m.avatarUrl) ? m.avatarUrl : '',
    banner:      '',
    birthday:    '',
    proxyTags:   [],
    keepProxy:   false,
    notes:       (want.desc && m.desc) ? m.desc : '',
    fieldValues: {},
    createdAt:   Date.now(),
    archived:    false,
    order:       state.alters.length,
    unreadBoardIds: [],
    lastSeenBoardTimes: [],
    };
    state.alters.push(newAlter);
    created++;
   }
   });

   saveState();
   renderAll();
   closeModal();
   _spImportData = null;

   const parts = [];
   if (created)  parts.push(`${created} created`);
   if (updated)  parts.push(`${updated} updated`);
   if (skipped)  parts.push(`${skipped} skipped`);
   showToast('Simply Plural import done — ' + parts.join(', ') + '.', 4500);
  }
